name: Software Composition Analysis

on:
  push:

permissions:
  contents: read
  actions: write

jobs:
  sbom:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install cdxgen
        run: npm install -g @cyclonedx/cdxgen

      - name: Generate CDX SBOM
        run: cdxgen -r -o sbom.json --spec-version 1.6 --format json

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
          if-no-files-found: error

  sca:
    runs-on: ubuntu-latest
    needs: sbom
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download SBOM
        uses: actions/download-artifact@v4
        with:
          name: sbom

      - name: Run FOSSology analysis with per-dependency reports
        id: fossology
        uses: shatakshisgtiwari-jpg/fossology-action@e9be17d
        with:
          scan_mode: "scan-only-deps"
          scanners: "ojo copyright"
          report_format: "SPDX_JSON"
          sbom_path: "sbom.json"
          per_dependency_report: "true"
          per_dependency_report_dir: "per-dependency-reports"

      - name: Upload Consolidated Scan Results
        if: success() || failure()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: Fossology-consolidated-report
          path: results/

      - name: Upload Per-Dependency Reports
        if: success() || failure()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: Fossology-per-dependency-reports
          path: per-dependency-reports/



