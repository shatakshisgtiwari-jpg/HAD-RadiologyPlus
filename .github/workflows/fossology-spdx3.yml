name: FOSSology SPDX 3.0 Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

# [SPDX3-ADDITION] Removed REGISTRY/IMAGE_NAME env vars and build-image job.
# The scanner image is now built and pushed by fossology-fork CI
# (ghcr.io/shatakshisgtiwari-jpg/fossology-scanner:latest).
# fossology-action-fork references that image directly.

jobs:
  # ── Scan repo → Generate SPDX 3.0 report → Archive ──
  scan-and-report:
    runs-on: ubuntu-latest
    name: FOSSology Scan + SPDX 3.0 Report
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # [SPDX3-ADDITION] Image is pulled from fossology-fork's GHCR by the action
      - name: Run FOSSology scan + SPDX 3.0 report
        uses: shatakshisgtiwari-jpg/fossology-action@main
        with:
          scan_mode: 'repo'
          scanners: 'nomos ojo copyright keyword'
          report_format: 'SPDX3_JSON'
          allowlist_file_path: 'allowlist.json'

      - name: Fix result permissions
        if: always()
        run: sudo chmod -R a+rw results/ 2>/dev/null || true

      - name: Upload SPDX 3.0 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spdx3-report
          path: results/
