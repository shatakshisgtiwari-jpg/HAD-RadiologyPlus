name: SCA Full Pipeline — had-radiologyplus

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'Backend/**'
      - 'FrontEnd/package.json'
      - 'FrontEnd/package-lock.json'
      - 'pom.xml'
      - 'allowlist.json'
      - '.github/workflows/sca-full-pipeline.yml'
  workflow_dispatch:    # manual trigger needed

permissions:
  contents: read
  actions: write

env:
  PROJECT_NAME: had-radiologyplus
  PROJECT_VERSION: "1.0.0"
  CAPYCLI_DIR: capycli-fork
  REPORT_DIR: per-dependency-reports
  SOURCE_DIR: sources

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # JOB 1: Generate SBOM with cdxgen
  #
  # cdxgen automatically includes download URLs (resolved tarball URLs from
  # package-lock.json, PyPI, etc.) as externalReferences in the SBOM.
  # No separate URL enrichment is needed.
  # ────────────────────────────────────────────────────────────────────────────
  generate-sbom:
    name: "Step 1 · Generate CycloneDX SBOM"
    runs-on: self-hosted

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install Maven
        run: |
          $mavenExtractDir = Join-Path $env:USERPROFILE ".maven"
          $existingMavenHome = Get-ChildItem "$mavenExtractDir\apache-maven-*" -Directory -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName

          if ($existingMavenHome -and (Test-Path "$existingMavenHome\bin\mvn.cmd")) {
            Write-Host "Reusing already-installed Maven at $existingMavenHome"
            [Environment]::SetEnvironmentVariable("MAVEN_HOME", $existingMavenHome, "Process")
            [Environment]::SetEnvironmentVariable("PATH", "$existingMavenHome\bin;$env:PATH", "Process")
          } elseif (-not (Get-Command mvn -ErrorAction SilentlyContinue)) {
            Write-Host "Installing Maven..."
            $zipPath = Join-Path $env:TEMP "apache-maven-3.9.9-bin.zip"
            $downloadOk = $false
            for ($attempt = 1; $attempt -le 3 -and -not $downloadOk; $attempt++) {
              try {
                Invoke-WebRequest -Uri "https://repo1.maven.org/maven2/org/apache/maven/apache-maven/3.9.9/apache-maven-3.9.9-bin.zip" `
                  -OutFile $zipPath -TimeoutSec 60
                $downloadOk = $true
              } catch {
                Write-Host "Download attempt $attempt failed: $($_.Exception.Message)"
                Start-Sleep -Seconds 5
              }
            }
            if (-not $downloadOk) {
              Write-Host "::error::Failed to download Maven after 3 attempts"
              exit 1
            }
            Expand-Archive $zipPath -DestinationPath $mavenExtractDir -Force
            Remove-Item $zipPath -ErrorAction SilentlyContinue
            $mavenHome = (Get-ChildItem "$mavenExtractDir\apache-maven-*" -Directory | Select-Object -First 1).FullName
            [Environment]::SetEnvironmentVariable("MAVEN_HOME", $mavenHome, "Process")
            [Environment]::SetEnvironmentVariable("PATH", "$mavenHome\bin;$env:PATH", "Process")
          }

          Write-Host "Maven version:"
          mvn -version
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::mvn -version exited with code $LASTEXITCODE"
            exit 1
          }
          exit 0
        shell: powershell

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache cdxgen
        id: cache-cdxgen
        uses: actions/cache@v4
        with:
          path: ~/AppData/Roaming/npm/node_modules/@cyclonedx/cdxgen
          key: cdxgen-${{ runner.os }}

      - name: Install cdxgen
        if: steps.cache-cdxgen.outputs.cache-hit != 'true'
        run: npm install -g @cyclonedx/cdxgen

      - name: Generate SBOM
        run: cdxgen -r -o sbom.json --spec-version 1.6 --format json

      - name: Verify SBOM was created
        run: |
          if (-not (Test-Path sbom.json)) {
            Write-Error "sbom.json not found!"
            exit 1
          }
          $sbom = Get-Content sbom.json | ConvertFrom-Json
          $compCount = $sbom.components.Count
          $withUrls = 0
          foreach ($comp in $sbom.components) {
            foreach ($ref in $comp.externalReferences) {
              if ($ref.comment -eq "source archive (download location)" -or
                  $ref.comment -eq "binary (download location)") {
                $withUrls++
                break
              }
            }
          }
          Write-Host "sbom.json created successfully - $compCount components, $withUrls with download URLs"
        shell: powershell

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
          if-no-files-found: error

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 2: Map SBOM to SW360
  #
  # Maps the SBOM to SW360 by PURL. No URL enrichment needed — cdxgen already
  # included download URLs from package registries in the SBOM.
  # ────────────────────────────────────────────────────────────────────────────
  map-to-sw360:
    name: "Step 2 · Map to SW360"
    runs-on: self-hosted
    needs: generate-sbom
    timeout-minutes: 60

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Download SBOM artifact
        uses: actions/download-artifact@v4
        with:
          name: sbom

      - name: Checkout CapyCLI fork
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/capycli
          ref: feat/sw360/upload_reports
          path: ${{ env.CAPYCLI_DIR }}
          clean: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CapyCLI (if needed)
        run: |
          $installed = pip list 2>`$null | Select-String -Pattern "^capycli\s"
          if (-not $installed) {
              Write-Host "Installing CapyCLI..."
              pip install . --force-reinstall
              if ($LASTEXITCODE -ne 0) { exit 1 }
          } else {
              Write-Host "CapyCLI already installed"
          }
        working-directory: ${{ env.CAPYCLI_DIR }}
        shell: powershell

      - name: Map SBOM to SW360
        run: |
          python -m capycli bom map `
            -i sbom.json `
            -url ${{ vars.SW360_URL }} `
            -t ${{ secrets.SW360_TOKEN }} `
            -mr mapping-result.json `
            -o mapped-sbom.json `
            --matchmode full-search,all-versions `
            -v
        shell: powershell

      - name: Verify mapped SBOM
        run: |
          if (-not (Test-Path mapped-sbom.json)) {
            Write-Host "ERROR: mapped-sbom.json not found"
            exit 1
          }
          Write-Host "mapped-sbom.json created successfully"
        shell: powershell

      # Upload mapping results for debugging (not consumed downstream — Step 3 merged here)
      - name: Upload mapping results (debug)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mapping-result
          path: mapping-result.json

      # ── Inline Step 3: Create missing components & releases ──
      # (Merged into Step 2 to eliminate redundant CapyCLI setup + artifact handoff)

      - name: Create missing components
        run: |
          python -m capycli bom createcomponents `
            -i mapped-sbom.json `
            -o created-sbom.json `
            -url ${{ vars.SW360_URL }} `
            -t ${{ secrets.SW360_TOKEN }} `
            --download `
            -v
        shell: powershell

      - name: Create missing releases
        run: |
          python -m capycli bom createreleases `
            -i created-sbom.json `
            -o created-sbom.json `
            -url ${{ vars.SW360_URL }} `
            -t ${{ secrets.SW360_TOKEN }} `
            -v
        shell: powershell

      - name: Verify created SBOM
        run: |
          if (-not (Test-Path created-sbom.json)) {
            Write-Host "ERROR: created-sbom.json not found"
            exit 1
          }
          Write-Host "created-sbom.json created successfully ($(Get-Item created-sbom.json).Length bytes)"
        shell: powershell

      - name: Upload created SBOM
        uses: actions/upload-artifact@v4
        with:
          name: created-sbom
          path: created-sbom.json

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 3: Create/update SW360 project + Capture project ID
  # ────────────────────────────────────────────────────────────────────────────
  create-project:
    name: "Step 3 · Create/update SW360 project"
    runs-on: self-hosted
    needs: map-to-sw360
    timeout-minutes: 30

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Download created SBOM
        uses: actions/download-artifact@v4
        with:
          name: created-sbom

      - name: Checkout CapyCLI fork
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/capycli
          ref: feat/sw360/upload_reports
          path: ${{ env.CAPYCLI_DIR }}
          clean: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CapyCLI (if needed)
        run: |
          $installed = pip list 2>`$null | Select-String -Pattern "^capycli\s"
          if (-not $installed) {
              Write-Host "Installing CapyCLI..."
              pip install . --force-reinstall
              if ($LASTEXITCODE -ne 0) { exit 1 }
          } else {
              Write-Host "CapyCLI already installed"
          }
        working-directory: ${{ env.CAPYCLI_DIR }}
        shell: powershell

      - name: Create or update SW360 project
        run: |
          python -m capycli project create `
            -i created-sbom.json `
            -url ${{ vars.SW360_URL }} `
            -t ${{ secrets.SW360_TOKEN }} `
            -name "${{ env.PROJECT_NAME }}" `
            -version "${{ env.PROJECT_VERSION }}" `
            -source had-radiologyplus-project-info.json `
            -v
        shell: powershell

      - name: Capture SW360 project ID
        id: get-project-id
        run: |
          Write-Host "=== Capturing SW360 project ID ==="
          $projectId = $null

          # Method 1: Try capycli project find (search by name)
          Write-Host "Method 1: Searching via capycli project find..."
          $output = python -m capycli project find `
            -name "${{ env.PROJECT_NAME }}" `
            -url ${{ vars.SW360_URL }} `
            -t ${{ secrets.SW360_TOKEN }} 2>&1
          $null = $LASTEXITCODE
          $match = ($output | Select-String -Pattern '([a-f0-9]{32})' -AllMatches)
          if ($match -and $match.Matches.Count -gt 0) {
            $projectId = $match.Matches.Groups[1].Value
            Write-Host "Found project ID via search: $projectId"
          }

          # Method 2: Query SW360 API directly
          if (-not $projectId) {
            Write-Host "Method 2: Querying SW360 API directly..."
            try {
              $token = "${{ secrets.SW360_TOKEN }}"
              $url = "${{ vars.SW360_URL }}"
              $searchUrl = "$url/resource/api/search?type=project&searchText=${{ env.PROJECT_NAME }}&pagination=0&elements=10"
              $response = Invoke-RestMethod -Uri $searchUrl -Headers @{
                "X-CSRF-Token" = "$token"
                "Authorization" = "Token $token"
              } -ErrorAction Stop
              if ($response._embedded -and $response._embedded."sw360:projects") {
                foreach ($proj in $response._embedded."sw360:projects") {
                  if ($proj.name -eq "${{ env.PROJECT_NAME }}" -and $proj.version -eq "${{ env.PROJECT_VERSION }}") {
                    $href = $proj._links.self.href
                    $projectId = $href.Split('/')[-1]
                    Write-Host "Found project ID via API: $projectId"
                    break
                  }
                }
              }
            } catch {
              Write-Host "API query failed: $($_.Exception.Message)"
            }
          }

          # Method 3: List all projects
          if (-not $projectId) {
            Write-Host "Method 3: Listing all projects..."
            try {
              $token = "${{ secrets.SW360_TOKEN }}"
              $url = "${{ vars.SW360_URL }}"
              $listUrl = "$url/resource/api/projects?pagination=0&elements=50"
              $response = Invoke-RestMethod -Uri $listUrl -Headers @{
                "X-CSRF-Token" = "$token"
                "Authorization" = "Token $token"
              } -ErrorAction Stop
              if ($response._embedded -and $response._embedded."sw360:projects") {
                foreach ($proj in $response._embedded."sw360:projects") {
                  if ($proj.name -eq "${{ env.PROJECT_NAME }}" -and $proj.version -eq "${{ env.PROJECT_VERSION }}") {
                    $href = $proj._links.self.href
                    $projectId = $href.Split('/')[-1]
                    Write-Host "Found project ID via listing: $projectId"
                    break
                  }
                }
              }
            } catch {
              Write-Host "Project listing failed: $($_.Exception.Message)"
            }
          }

          if ($projectId) {
            Write-Host "SUCCESS: Project ID = $projectId"
            Add-Content -Path $env:GITHUB_OUTPUT -Value "project_id=$projectId"
          } else {
            Write-Host "ERROR: Could not find project ID"
            exit 1
          }
          exit 0
        shell: powershell

      - name: Save project ID to file
        run: |
          $projectId = "${{ steps.get-project-id.outputs.project_id }}"
          $projectId | Out-File -FilePath project-id.txt -Encoding UTF8
        shell: powershell

      - name: Upload project ID
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: project-id
          path: project-id.txt

      # Note: Step 4 (filter-by-clearing-state) downloads 'created-sbom' from Step 2.
      # The filtered SBOM is then consumed by Step 5 (scan-fossology).

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 4: Filter SBOM by clearing state
  #
  # Queries SW360 for each release's clearingState and filters the SBOM to
  # only include releases that still need clearing:
  #   NEW_CLEARING (0), SENT_TO_CLEARING_TOOL (1), UNDER_CLEARING (2)
  #
  # Releases that already have REPORT_AVAILABLE (3) or APPROVED (4) are
  # skipped — they already have clearing results and don't need re-scanning.
  #
  # This avoids redundant downloads, scans, and uploads for already-cleared
  # dependencies, saving significant pipeline time.
  # ────────────────────────────────────────────────────────────────────────────
  filter-by-clearing-state:
    name: "Step 4 · Filter by clearing state"
    runs-on: self-hosted
    needs: map-to-sw360
    timeout-minutes: 30

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Download created SBOM
        uses: actions/download-artifact@v4
        with:
          name: created-sbom

      - name: Filter SBOM by clearing state
        run: |
          $sw360Url = "${{ vars.SW360_URL }}"
          $token = "${{ secrets.SW360_TOKEN }}"
          $sbomPath = "created-sbom.json"
          $outPath = "filtered-sbom.json"

          $sbom = Get-Content $sbomPath -Raw | ConvertFrom-Json
          $total = $sbom.components.Count
          Write-Host "=== Filtering $total components by clearing state ==="

          $included = @()
          $skipped = @()
          $errors = @()

          foreach ($comp in $sbom.components) {
            $sw360Id = $null
            foreach ($prop in $comp.properties) {
              if ($prop.name -eq "siemens:sw360Id") {
                $sw360Id = $prop.value
                break
              }
            }

            if (-not $sw360Id) {
              # No SW360 ID — new/unmapped component, include it
              $included += $comp
              Write-Host "  [INCLUDE] $($comp.name)@$($comp.version) (no SW360 ID)"
              continue
            }

            try {
              $releaseUrl = "$sw360Url/resource/api/releases/$sw360Id"
              $response = Invoke-RestMethod -Uri $releaseUrl -Headers @{
                "Authorization" = "Token $token"
              } -ErrorAction Stop

              $clearingState = $response.clearingState

              if (-not $clearingState) {
                # No clearing state set — needs clearing
                $included += $comp
                Write-Host "  [INCLUDE] $($comp.name)@$($comp.version) (no clearing state)"
              } elseif ($clearingState -in @("REPORT_AVAILABLE", "APPROVED")) {
                $skipped += $comp
                Write-Host "  [SKIP]    $($comp.name)@$($comp.version) - clearingState=$clearingState"
              } else {
                # NEW_CLEARING, SENT_TO_CLEARING_TOOL, UNDER_CLEARING — needs clearing
                $included += $comp
                Write-Host "  [INCLUDE] $($comp.name)@$($comp.version) - clearingState=$clearingState"
              }
            } catch {
              # Query failed — include to be safe
              $included += $comp
              $errors += $comp
              Write-Host "  [INCLUDE] $($comp.name)@$($comp.version) - query error: $($_.Exception.Message)"
            }
          }

          # Build filtered SBOM
          $filteredSbom = $sbom | Select-Object -Property *
          $filteredSbom.components = $included

          # Use WriteAllText to avoid UTF-8 BOM that Out-File adds in PowerShell 5.1
          $json = $filteredSbom | ConvertTo-Json -Depth 10
          [System.IO.File]::WriteAllText($outPath, $json)

          Write-Host ""
          Write-Host "=== Filtering Summary ==="
          Write-Host "Total components:     $total"
          Write-Host "Included (need scan): $($included.Count)"
          Write-Host "Skipped (already cleared): $($skipped.Count)"
          Write-Host "Query errors:         $($errors.Count)"
          Write-Host "Filtered SBOM saved to: $outPath ($(Get-Item $outPath).Length bytes)"
        shell: powershell

      - name: Verify filtered SBOM
        run: |
          if (-not (Test-Path filtered-sbom.json)) {
            Write-Host "ERROR: filtered-sbom.json not found"
            exit 1
          }
          $sbom = Get-Content filtered-sbom.json -Raw | ConvertFrom-Json
          Write-Host "filtered-sbom.json created - $($sbom.components.Count) components remaining"
        shell: powershell

      - name: Upload filtered SBOM
        uses: actions/upload-artifact@v4
        with:
          name: filtered-sbom
          path: filtered-sbom.json

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 5: Download sources + FOSSology scan
  #
  # Downloads dependency sources using URLs already in the SBOM (added by
  # cdxgen from package registries), then runs FOSSology scanner on each
  # dependency to generate per-dependency SPDX license reports.
  #
  # Uses the filtered SBOM from Step 4 — only processes releases that still
  # need clearing (NEW_CLEARING, SENT_TO_CLEARING_TOOL, UNDER_CLEARING).
  # ────────────────────────────────────────────────────────────────────────────
  scan-fossology:
    name: "Step 5 · Download sources & Scan"
    runs-on: self-hosted
    needs: filter-by-clearing-state
    timeout-minutes: 120

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Download filtered SBOM
        uses: actions/download-artifact@v4
        with:
          name: filtered-sbom

      - name: Checkout CapyCLI fork
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/capycli
          ref: feat/sw360/upload_reports
          path: ${{ env.CAPYCLI_DIR }}
          clean: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CapyCLI (if needed)
        run: |
          $installed = pip list 2>`$null | Select-String -Pattern "^capycli\s"
          if (-not $installed) {
              Write-Host "Installing CapyCLI..."
              pip install . --force-reinstall
              if ($LASTEXITCODE -ne 0) { exit 1 }
          } else {
              Write-Host "CapyCLI already installed"
          }
        working-directory: ${{ env.CAPYCLI_DIR }}
        shell: powershell

      # Download sources in PARALLEL using PowerShell 7 ForEach-Object -Parallel.
      # Falls back to capycli sequential download if pwsh is unavailable.
      - name: Download dependency sources (parallel)
        run: |
          $sbomPath = "filtered-sbom.json"
          $sourceDir = "${{ env.SOURCE_DIR }}"
          $outSbom = "sourced-sbom.json"

          if (-not (Test-Path $sourceDir)) {
            New-Item -ItemType Directory -Path $sourceDir | Out-Null
          }

          # Try parallel download with PowerShell 7
          $pwshAvailable = (Get-Command pwsh -ErrorAction SilentlyContinue) -ne $null
          if ($pwshAvailable) {
            Write-Host "=== Parallel download with PowerShell 7 ==="
            pwsh -NoProfile -Command {
              param($SbomPath, $SourceDir)
              $sbom = Get-Content $SbomPath -Raw | ConvertFrom-Json
              $urls = @()
              foreach ($comp in $sbom.components) {
                $url = $null
                foreach ($ref in $comp.externalReferences) {
                  if ($ref.url -and ($ref.type -eq "vcs" -or $ref.type -eq "distribution" -or $ref.type -eq "website")) {
                    $url = $ref.url; break
                  }
                }
                if ($url) {
                  $safeName = "$($comp.name)-$($comp.version)" -replace '[<>:"/\\|?*]', '_'
                  $urls += [PSCustomObject]@{ Name = $comp.name; SafeName = $safeName; Url = $url }
                }
              }
              Write-Host "Found $($urls.Count) download URLs"
              $urls | ForEach-Object -Parallel {
                $destDir = Join-Path $using:SourceDir $_.SafeName
                if (-not (Test-Path $destDir)) {
                  $null = New-Item -ItemType Directory -Path $destDir -Force
                  try {
                    Invoke-WebRequest -Uri $_.Url -OutFile (Join-Path $destDir "source.zip") -TimeoutSec 120 -ErrorAction Stop
                    Write-Host "  [OK] $($_.Name)"
                  } catch {
                    Write-Host "  [FAIL] $($_.Name): $($_.Exception.Message)"
                  }
                } else {
                  Write-Host "  [SKIP] $($_.Name) (already exists)"
                }
              } -ThrottleLimit 10
            } -Args $sbomPath, $sourceDir
          } else {
            Write-Host "PowerShell 7 not available, falling back to sequential download"
          }

          # Always run capycli to update SBOM metadata with local file paths.
          # If parallel download already fetched files, this is near-instant.
          Write-Host "=== Updating SBOM with local file paths ==="
          python -m capycli bom downloadsources `
            -i $sbomPath `
            -source $sourceDir `
            -o $outSbom `
            -v
        shell: powershell

      - name: Verify sourced SBOM
        run: |
          if (-not (Test-Path sourced-sbom.json)) {
            Write-Host "ERROR: sourced-sbom.json not found"
            exit 1
          }
          Write-Host "sourced-sbom.json created successfully ($(Get-Item sourced-sbom.json).Length bytes)"
        shell: powershell

      - name: Run FOSSology analysis
        id: fossology
        uses: shatakshisgtiwari-jpg/fossology-action@feat/action/per-dependency-report
        with:
          scan_mode: "scan-only-deps"
          scanners: "ojo copyright"
          report_format: "SPDX_JSON"
          sbom_path: "filtered-sbom.json"
          per_dependency_report: "true"
          report_dir: ${{ env.REPORT_DIR }}

      - name: Verify FOSSology output
        run: |
          if (-not (Test-Path "results/sbom_spdx.json")) {
            Write-Host "ERROR: results/sbom_spdx.json not found"
            exit 1
          }
          $size = (Get-Item "results/sbom_spdx.json").Length
          Write-Host "OK: results/sbom_spdx.json exists ($size bytes)"
          $reportFiles = Get-ChildItem -Path ${{ env.REPORT_DIR }} -Filter "*.spdx.json" -Recurse -ErrorAction SilentlyContinue
          Write-Host "Per-dependency reports: $($reportFiles.Count)"
          if ($reportFiles.Count -eq 0) {
            Write-Host "WARNING: No per-dependency reports generated - will use consolidated report only"
          }
        shell: powershell

      - name: Upload scan artifacts
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: scan-artifacts
          path: |
            sourced-sbom.json
            results/
            ${{ env.REPORT_DIR }}/

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 6: Upload sources & reports to SW360
  #
  # Uploads scan results only for releases that were scanned (those filtered
  # by clearing state in Step 4). Already-cleared releases are untouched.
  # ────────────────────────────────────────────────────────────────────────────
  upload-to-sw360:
    name: "Step 6 · Upload to SW360"
    runs-on: self-hosted
    needs: scan-fossology
    timeout-minutes: 120

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Download scan artifacts
        uses: actions/download-artifact@v4
        with:
          name: scan-artifacts
          path: scan-output

      - name: Checkout CapyCLI fork
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/capycli
          ref: feat/sw360/upload_reports
          path: ${{ env.CAPYCLI_DIR }}
          clean: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CapyCLI (if needed)
        run: |
          $installed = pip list 2>`$null | Select-String -Pattern "^capycli\s"
          if (-not $installed) {
              Write-Host "Installing CapyCLI..."
              pip install . --force-reinstall
              if ($LASTEXITCODE -ne 0) { exit 1 }
          } else {
              Write-Host "CapyCLI already installed"
          }
        working-directory: ${{ env.CAPYCLI_DIR }}
        shell: powershell

      - name: Restore files to working directory
        run: |
          Copy-Item "scan-output/sourced-sbom.json" -Destination "sourced-sbom.json" -Force
          if (Test-Path "scan-output/results") {
            Copy-Item "scan-output/results" -Destination "results" -Recurse -Force
          }
          if (Test-Path "scan-output/${{ env.REPORT_DIR }}") {
            Copy-Item "scan-output/${{ env.REPORT_DIR }}" -Destination "${{ env.REPORT_DIR }}" -Recurse -Force
          }
          if (Test-Path "scan-output/sources") {
            Copy-Item "scan-output/sources" -Destination "sources" -Recurse -Force
          }
        shell: powershell

      - name: Attach source files to SW360 releases
        run: |
          python -m capycli bom createreleases `
            -i sourced-sbom.json `
            -o final-sbom.json `
            -url ${{ vars.SW360_URL }} `
            -t ${{ secrets.SW360_TOKEN }} `
            -source ${{ env.SOURCE_DIR }} `
            -v
        shell: powershell

      - name: Verify final SBOM
        run: |
          if (-not (Test-Path final-sbom.json)) {
            Write-Host "ERROR: final-sbom.json not found"
            exit 1
          }
          Write-Host "final-sbom.json created successfully ($(Get-Item final-sbom.json).Length bytes)"
        shell: powershell

      # Upload per-dependency scan reports to SW360
      # Note: This step makes 3 HTTP calls per dependency (GET attachments, DELETE old, POST new).
      # With many npm transitive deps, this can take a long time.
      - name: Upload per-dependency scan reports to SW360
        run: |
          $reportFiles = Get-ChildItem -Path ${{ env.REPORT_DIR }} -Filter "*.spdx.json" -Recurse -ErrorAction SilentlyContinue
          $reportCount = $reportFiles.Count
          Write-Host "Per-dependency reports found: $reportCount"

          if ($reportCount -gt 0) {
            $maxRetries = 3
            $retryDelay = 30
            $lastExit = 0

            for ($attempt = 1; $attempt -le $maxRetries; $attempt++) {
              Write-Host "=== Upload attempt $attempt of $maxRetries ==="
              $proc = Start-Process -FilePath python -ArgumentList @(
                "-m", "capycli", "bom", "uploadreports",
                "-i", "final-sbom.json",
                "--report-dir", "${{ env.REPORT_DIR }}",
                "--filetype", "COMPONENT_LICENSE_INFO_XML",
                "--comment", "Fossology SPDX scan - ${{ env.PROJECT_NAME }} ${{ env.PROJECT_VERSION }}",
                "-url", "${{ vars.SW360_URL }}",
                "-t", "${{ secrets.SW360_TOKEN }}",
                "-o", "final-sbom.json",
                "-v"
              ) -NoNewWindow -Wait -PassThru
              $lastExit = $proc.ExitCode

              if ($lastExit -eq 0) {
                Write-Host "Upload completed successfully on attempt $attempt"
                break
              } else {
                Write-Host "Upload failed (exit code $lastExit) on attempt $attempt"
                if ($attempt -lt $maxRetries) {
                  Write-Host "Retrying in $retryDelay seconds..."
                  Start-Sleep -Seconds $retryDelay
                }
              }
            }

            if ($lastExit -ne 0) {
              Write-Host "::warning::Per-dependency upload failed after $maxRetries attempts (exit code $lastExit)"
            }
          } else {
            Write-Host "WARNING: No per-dependency reports found - skipping per-dependency upload"
          }
        shell: powershell

      # Also upload the consolidated report as a fallback
      - name: Upload consolidated scan report to SW360
        run: |
          if (Test-Path "results/sbom_spdx.json") {
            Write-Host "Uploading consolidated report to all releases..."
            $maxRetries = 3
            $retryDelay = 30
            $lastExit = 0

            for ($attempt = 1; $attempt -le $maxRetries; $attempt++) {
              Write-Host "=== Consolidated upload attempt $attempt of $maxRetries ==="
              $proc = Start-Process -FilePath python -ArgumentList @(
                "-m", "capycli", "bom", "uploadreports",
                "-i", "final-sbom.json",
                "--report-file", "results/sbom_spdx.json",
                "--filetype", "COMPONENT_LICENSE_INFO_XML",
                "--comment", "Consolidated Fossology SPDX scan - ${{ env.PROJECT_NAME }} ${{ env.PROJECT_VERSION }}",
                "-url", "${{ vars.SW360_URL }}",
                "-t", "${{ secrets.SW360_TOKEN }}",
                "-o", "final-sbom.json",
                "-v"
              ) -NoNewWindow -Wait -PassThru
              $lastExit = $proc.ExitCode

              if ($lastExit -eq 0) {
                Write-Host "Consolidated upload completed successfully on attempt $attempt"
                break
              } else {
                Write-Host "Consolidated upload failed (exit code $lastExit) on attempt $attempt"
                if ($attempt -lt $maxRetries) {
                  Write-Host "Retrying in $retryDelay seconds..."
                  Start-Sleep -Seconds $retryDelay
                }
              }
            }

            if ($lastExit -ne 0) {
              Write-Host "::warning::Consolidated report upload failed after $maxRetries attempts (exit code $lastExit)"
            }
          } else {
            Write-Host "WARNING: Consolidated report not found - skipping"
          }
        shell: powershell

      - name: Upload final SBOM
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: final-sbom
          path: final-sbom.json

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 7: Validate pipeline completeness
  # ────────────────────────────────────────────────────────────────────────────
  validate-pipeline:
    name: "Step 7 · Validate pipeline"
    runs-on: self-hosted
    needs: upload-to-sw360
    timeout-minutes: 30

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Download final SBOM
        uses: actions/download-artifact@v4
        with:
          name: final-sbom

      - name: Download project ID
        uses: actions/download-artifact@v4
        with:
          name: project-id

      - name: Checkout CapyCLI fork
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/capycli
          ref: feat/sw360/upload_reports
          path: ${{ env.CAPYCLI_DIR }}
          clean: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CapyCLI (if needed)
        run: |
          $installed = pip list 2>`$null | Select-String -Pattern "^capycli\s"
          if (-not $installed) {
              Write-Host "Installing CapyCLI..."
              pip install . --force-reinstall
              if ($LASTEXITCODE -ne 0) { exit 1 }
          } else {
              Write-Host "CapyCLI already installed"
          }
        working-directory: ${{ env.CAPYCLI_DIR }}
        shell: powershell

      - name: Validate pipeline completeness
        run: |
          $projectId = (Get-Content -Path project-id.txt -Raw).Trim()
          if (-not $projectId) {
            Write-Host "ERROR: Project ID not available"
            exit 1
          }

          python -m capycli project prerequisites `
            -i final-sbom.json `
            -id $projectId `
            -url ${{ vars.SW360_URL }} `
            -t ${{ secrets.SW360_TOKEN }} `
            --check-reports `
            --forceerror `
            -v
        shell: powershell

      - name: Upload all final artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: all-sbom-artifacts
          path: |
            final-sbom.json

      - name: Upload FOSSology reports
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: fossology-reports
          path: |
            results/
            ${{ env.REPORT_DIR }}/
          if-no-files-found: warn
