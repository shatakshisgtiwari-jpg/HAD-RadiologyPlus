name: SCA Full Pipeline — had-radiologyplus

on:
  push:
    branches: [ main, master, develop ]
  workflow_dispatch:    # manual trigger also available

permissions:
  contents: read
  actions: write

env:
  PROJECT_NAME: had-radiologyplus
  PROJECT_VERSION: "1.0.0"
  CAPYCLI_DIR: capycli-fork
  REPORT_DIR: per-dependency-reports
  SOURCE_DIR: sources

jobs:
  # ──────────────────────────────────────────────────────────
  # JOB 1: Generate SBOM
  # ──────────────────────────────────────────────────────────
  generate-sbom:
    name: "Step 1 · Generate CycloneDX SBOM"
    runs-on: self-hosted          # must reach localhost:8080 SW360

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install Maven
        run: |
          if (-not (Get-Command mvn -ErrorAction SilentlyContinue)) {
            Write-Host "Installing Maven..."
            Invoke-WebRequest -Uri "https://repo1.maven.org/maven2/org/apache/maven/apache-maven/3.9.9/apache-maven-3.9.9-bin.zip" `
              -OutFile maven.zip
            Expand-Archive maven.zip -DestinationPath $env:USERPROFILE\.maven -Force
            Remove-Item maven.zip
            $mavenHome = (Get-ChildItem $env:USERPROFILE\.maven\apache-maven* -Directory).FullName
            [Environment]::SetEnvironmentVariable("MAVEN_HOME", $mavenHome, "Process")
            [Environment]::SetEnvironmentVariable("PATH", "$mavenHome\bin;$env:PATH", "Process")
          }
          Write-Host "Maven version:"
          mvn -version
        shell: powershell

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install cdxgen
        run: npm install -g @cyclonedx/cdxgen

      - name: Generate SBOM
        run: cdxgen -r -o sbom.json --spec-version 1.6 --format json

      - name: Verify SBOM was created
        run: |
          if (-not (Test-Path sbom.json)) {
            Write-Error "sbom.json not found!"
            exit 1
          }
          Write-Host "sbom.json created successfully"
        shell: powershell

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────
  # JOB 2: CapyCLI + Fossology + SW360 upload
  # ──────────────────────────────────────────────────────────
  sca-pipeline:
    name: "Map → Create → Scan → Upload → Validate"
    runs-on: self-hosted
    needs: generate-sbom

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          clean: true       # ensure fresh checkout on self-hosted runner
      - name: Clean stale workspace files
        run: |
          Remove-Item -Force -ErrorAction SilentlyContinue `
            mapped-sbom.json, created-sbom.json, sourced-sbom.json, `
            final-sbom.json, mapping-result.json, sbom.json
          Write-Host "Workspace cleaned"
        shell: powershell

      # ── Download SBOM from job 1 ───────────────────────────
      - name: Download SBOM artifact
        uses: actions/download-artifact@v4
        with:
          name: sbom

      # ── Clone CapyCLI fork ─────────────────────────────────
      - name: Checkout CapyCLI fork
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/capycli
          ref: feat/sw360/upload_reports
          path: ${{ env.CAPYCLI_DIR }}
          clean: true       # ensure fresh checkout, no stale files

      # ── Checkout Fossology fork for per-dep script ─────────
      - name: Checkout Fossology fork (per-dependency script)
        uses: actions/checkout@v4
        with:
          repository: shatakshisgtiwari-jpg/fossology-action
          ref: feat/action/per-dependency-report
          path: fossology-action-fork

      # ── Python + CapyCLI setup ─────────────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CapyCLI (force reinstall)
        run: |
          pip uninstall capycli -y
          pip install . --force-reinstall --no-cache-dir
        working-directory: ${{ env.CAPYCLI_DIR }}
        shell: powershell

      - name: Verify CapyCLI installation
        run: |
          Write-Host "=== Verifying capycli fixes ==="
          $mapBomPath = Join-Path ${{ env.CAPYCLI_DIR }} "capycli\bom\map_bom.py"
          $content = Get-Content $mapBomPath -Raw
          if ($content -match 'Incomplete mapping is acceptable') {
            Write-Host "OK: map_bom.py contains exit-0 fix"
          } else {
            Write-Host "ERROR: map_bom.py missing exit-0 fix - stale code!"
            exit 1
          }
          $createCompPath = Join-Path ${{ env.CAPYCLI_DIR }} "capycli\bom\create_components.py"
          $content2 = Get-Content $createCompPath -Raw
          if ($content2 -match 'Skipped.*400.*Bad Request') {
            Write-Host "OK: create_components.py contains 400-handling fix"
          } else {
            Write-Host "ERROR: create_components.py missing 400-handling fix - stale code!"
            exit 1
          }
          Write-Host "=== CapyCLI fixes verified ==="
        shell: powershell

      # ── Step 2: Map SBOM to SW360 ─────────────────────────
      - name: "Step 2 · Map SBOM to SW360"
        run: |
          python -m capycli bom map `
            -i sbom.json `
            -url ${{ vars.SW360_URL }} `
            -t ${{ secrets.SW360_TOKEN }} `
            -mr mapping-result.json `
            -o mapped-sbom.json `
            --matchmode full-search,all-versions `
            -v
        shell: powershell

      - name: Verify mapped SBOM
        run: |
          if (-not (Test-Path mapped-sbom.json)) {
            Write-Host "WARNING: mapped-sbom.json not found - Step 2 may have failed completely"
            exit 1
          }
          Write-Host "mapped-sbom.json created successfully"
        shell: powershell

      # ── Step 3a: Create missing components ────────────────
      - name: "Step 3a · Create missing components on SW360"
        continue-on-error: true
        run: |
          python -m capycli bom createcomponents `
            -i mapped-sbom.json `
            -o created-sbom.json `
            -url ${{ vars.SW360_URL }} `
            -t ${{ secrets.SW360_TOKEN }} `
            -v
        shell: powershell

      # ── Fallback: ensure created-sbom.json always exists ──
      - name: "Step 3a-fallback · Ensure created-sbom.json exists"
        run: |
          Write-Host "Checking workspace files..."
          Get-ChildItem -Path . -Filter "*.json" | Select-Object Name, Length
          if (-not (Test-Path created-sbom.json)) {
            Write-Host "created-sbom.json missing - copying mapped-sbom.json"
            Copy-Item mapped-sbom.json created-sbom.json
          }
          if (-not (Test-Path created-sbom.json)) {
            Write-Error "FATAL: created-sbom.json still missing after fallback!"
            exit 1
          }
          Write-Host "created-sbom.json verified ($(Get-Item created-sbom.json).Length bytes)"
        shell: powershell

      # ── Step 3b: Create missing releases ──────────────────
      - name: "Step 3b · Create missing releases on SW360"
        continue-on-error: true
        run: |
          python -m capycli bom createreleases `
            -i created-sbom.json `
            -o created-sbom.json `
            -url ${{ vars.SW360_URL }} `
            -t ${{ secrets.SW360_TOKEN }} `
            -v
        shell: powershell

      # ── Step 4: Create / update project ───────────────────
      - name: "Step 4 · Create / update SW360 project"
        continue-on-error: true
        run: |
          python -m capycli project create `
            -i created-sbom.json `
            -url ${{ vars.SW360_URL }} `
            -t ${{ secrets.SW360_TOKEN }} `
            -name "${{ env.PROJECT_NAME }}" `
            -version "${{ env.PROJECT_VERSION }}" `
            -source had-radiologyplus-project-info.json `
            -v
        shell: powershell

      # ── Capture project ID ─────────────────────────────────
      - name: "Capture SW360 project ID"
        id: get-project-id
        continue-on-error: true
        run: |
          $output = python -m capycli project find `
            -name "${{ env.PROJECT_NAME }}" `
            -version "${{ env.PROJECT_VERSION }}" `
            -url ${{ vars.SW360_URL }} `
            -t ${{ secrets.SW360_TOKEN }} 2>&1
          Write-Host $output
          $match = ($output | Select-String -Pattern '([a-f0-9]{32})' -AllMatches)
          if ($match -and $match.Matches.Count -gt 0) {
            $projectId = $match.Matches.Groups[1].Value
            Write-Host "Found project ID: $projectId"
            Add-Content -Path $env:GITHUB_OUTPUT -Value "project_id=$projectId"
          } else {
            Write-Host "WARNING: Could not auto-detect project ID - will use name/version instead"
          }
        shell: powershell

      # ── Step 5: Download sources ───────────────────────────
      - name: "Step 5 · Download dependency sources"
        run: |
          if (-not (Test-Path ${{ env.SOURCE_DIR }})) {
            New-Item -ItemType Directory -Path ${{ env.SOURCE_DIR }} | Out-Null
          }
          python -m capycli bom downloadsources `
            -i created-sbom.json `
            -source ${{ env.SOURCE_DIR }} `
            -o sourced-sbom.json `
            -v
        shell: powershell

      # ── Step 6: Fossology scan → per-dep reports ──────────
      - name: "Step 6 · Run FOSSology analysis"
        id: fossology
        continue-on-error: true
        run: |
          Write-Host "=== Running FOSSology scan ==="
          Write-Host "SBOM: created-sbom.json"
          Write-Host "Scanners: ojo copyright"
          Write-Host "Report format: SPDX_JSON"
          
          # Convert script.sh to LF line endings for bash compatibility
          $scriptPath = "fossology-action-fork/script.sh"
          $content = Get-Content $scriptPath -Raw
          $content = $content -replace '\r\n', '\n'
          Set-Content $scriptPath $content -NoNewline -Encoding UTF8
          
          # Run the fossology scanner script directly
          bash "$scriptPath"
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_PULL_REQUEST: ""
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPO_URL: ${{ github.repositoryUrl }}
          GITHUB_REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_ACTIONS: "true"
          SCANNERS: "ojo copyright"
          SCAN_MODE: "scan-only-deps"
          REPORT_FORMAT: "SPDX_JSON"
          SBOM_PATH: "created-sbom.json"
          SCAN_DIR: ""
          KEYWORD_CONF_FILE_PATH: ""
          ALLOWLIST_FILE_PATH: ""
          FROM_TAG: ""
          TO_TAG: ""

      - name: "Step 6b · Verify Fossology results"
        run: |
          Write-Host "=== Verifying Fossology results ==="
          if (Test-Path "results") {
            $files = Get-ChildItem -Path "results" -File
            Write-Host "Files in results/: $($files.Count)"
            $files | ForEach-Object { Write-Host "  $($_.Name) ($($_.Length) bytes)" }
            
            $jsonFiles = $files | Where-Object { $_.Extension -eq '.json' }
            if ($jsonFiles.Count -eq 0) {
              Write-Host "WARNING: No JSON reports found in results/"
              Write-Host "Contents of results/:"
              Get-ChildItem -Path "results" -Recurse | ForEach-Object { Write-Host "  $($_.FullName)" }
            } else {
              Write-Host "Found $($jsonFiles.Count) JSON report(s)"
            }
          } else {
            Write-Host "ERROR: results/ directory not found"
            Write-Host "Current directory contents:"
            Get-ChildItem -Path . | ForEach-Object { Write-Host "  $($_.Name)" }
          }
        shell: powershell

      - name: "Step 6c · Generate per-dependency SPDX reports"
        continue-on-error: true
        run: |
          Write-Host "=== Generating per-dependency reports ==="
          if (-not (Test-Path ${{ env.REPORT_DIR }})) {
            New-Item -ItemType Directory -Path ${{ env.REPORT_DIR }} | Out-Null
          }
          # Convert CRLF to LF for bash compatibility on Windows
          $scriptPath = "fossology-action-fork/scripts/generate-per-dependency-reports.sh"
          $content = Get-Content $scriptPath -Raw
          $content = $content -replace '\r\n', '\n'
          Set-Content $scriptPath $content -NoNewline -Encoding UTF8
          # Run the script with bash
          bash "$scriptPath"
        shell: powershell
        env:
          REPORT_FORMAT: "SPDX_JSON"
          SBOM_PATH: "created-sbom.json"
          PER_DEPENDENCY_REPORT_DIR: "${{ env.REPORT_DIR }}"

      - name: "Step 6d · Verify per-dependency reports"
        run: |
          Write-Host "=== Verifying per-dependency reports ==="
          if (Test-Path ${{ env.REPORT_DIR }}) {
            $files = Get-ChildItem -Path ${{ env.REPORT_DIR }} -Filter "*.spdx.json" -File
            Write-Host "Per-dependency reports found: $($files.Count)"
            $files | ForEach-Object { Write-Host "  $($_.Name) ($($_.Length) bytes)" }
            if ($files.Count -eq 0) {
              Write-Host "WARNING: No .spdx.json files found"
              Write-Host "Contents of ${{ env.REPORT_DIR }}:"
              Get-ChildItem -Path ${{ env.REPORT_DIR }} | ForEach-Object { Write-Host "  $($_.Name)" }
            }
          } else {
            Write-Host "WARNING: ${{ env.REPORT_DIR }} directory not found"
          }
        shell: powershell

      # ── Step 7: Attach sources to releases ────────────────
      - name: "Step 7 · Attach source files to SW360 releases"
        run: |
          python -m capycli bom createreleases `
            -i sourced-sbom.json `
            -o final-sbom.json `
            -url ${{ vars.SW360_URL }} `
            -t ${{ secrets.SW360_TOKEN }} `
            -source ${{ env.SOURCE_DIR }} `
            -v
        shell: powershell

      # ── Step 8: Upload per-dep scan reports ───────────────
      - name: "Step 8 · Upload per-dependency scan reports to SW360"
        run: |
          $reportFiles = Get-ChildItem -Path ${{ env.REPORT_DIR }} -Filter "*.spdx.json" -Recurse -ErrorAction SilentlyContinue
          $reportCount = $reportFiles.Count
          Write-Host "Reports found: $reportCount"

          if ($reportCount -gt 0) {
            python -m capycli bom uploadreports `
              -i final-sbom.json `
              --report-dir ${{ env.REPORT_DIR }} `
              --filetype COMPONENT_LICENSE_INFO_XML `
              --comment "Fossology SPDX scan - ${{ env.PROJECT_NAME }} ${{ env.PROJECT_VERSION }}" `
              -url ${{ vars.SW360_URL }} `
              -t ${{ secrets.SW360_TOKEN }} `
              -o final-sbom.json `
              -v
          } else {
            Write-Host "WARNING: No .spdx.json reports found - skipping upload."
          }
        shell: powershell

      # ── Step 9: Validate ───────────────────────────────────
      - name: "Step 9 · Validate pipeline completeness"
        run: |
          $idArg = @()
          $projectId = "${{ steps.get-project-id.outputs.project_id }}"
          if ($projectId) {
            $idArg = @("-id", $projectId)
          } else {
            $idArg = @("-name", "${{ env.PROJECT_NAME }}", "-version", "${{ env.PROJECT_VERSION }}")
          }

          python -m capycli project prerequisites `
            -i final-sbom.json `
            @idArg `
            -url ${{ vars.SW360_URL }} `
            -t ${{ secrets.SW360_TOKEN }} `
            --check-reports `
            --forceerror `
            -v
        shell: powershell

      # ── Upload all artifacts ────────────────────────────────
      - name: Upload SBOM artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-artifacts
          path: |
            mapped-sbom.json
            created-sbom.json
            sourced-sbom.json
            final-sbom.json
            

      - name: Upload Fossology consolidated report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fossology-consolidated-report
          path: results/
          if-no-files-found: warn

      - name: Upload per-dependency reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fossology-per-dependency-reports
          path: ${{ env.REPORT_DIR }}/
          if-no-files-found: warn
