name: SCA Full Pipeline — had-radiologyplus

on:
  push:
    branches: [ main, master, develop ]
  workflow_dispatch:    # manual trigger 

permissions:
  contents: read
  actions: write

env:
  PROJECT_NAME: had-radiologyplus
  PROJECT_VERSION: "1.0.0"
  CAPYCLI_DIR: capycli-fork
  REPORT_DIR: per-dependency-reports
  SOURCE_DIR: sources

jobs:
  # ──────────────────────────────────────────────────────────
  # JOB 1: Generate SBOM
  # ──────────────────────────────────────────────────────────
  generate-sbom:
    name: "Step 1 · Generate CycloneDX SBOM"
    runs-on: self-hosted          # must reach localhost:8080 SW360

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install Maven
        run: |
          if (-not (Get-Command mvn -ErrorAction SilentlyContinue)) {
            Write-Host "Installing Maven..."
            Invoke-WebRequest -Uri "https://repo1.maven.org/maven2/org/apache/maven/apache-maven/3.9.9/apache-maven-3.9.9-bin.zip" `
              -OutFile maven.zip
            Expand-Archive maven.zip -DestinationPath $env:USERPROFILE\.maven -Force
            Remove-Item maven.zip
            $mavenHome = (Get-ChildItem $env:USERPROFILE\.maven\apache-maven* -Directory).FullName
            [Environment]::SetEnvironmentVariable("MAVEN_HOME", $mavenHome, "Process")
            [Environment]::SetEnvironmentVariable("PATH", "$mavenHome\bin;$env:PATH", "Process")
          }
          Write-Host "Maven version:"
          mvn -version
        shell: powershell

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install cdxgen
        run: npm install -g @cyclonedx/cdxgen

      - name: Generate SBOM
        run: cdxgen -r -o sbom.json --spec-version 1.6 --format json

      - name: Verify SBOM was created
        run: |
          if (-not (Test-Path sbom.json)) {
            Write-Error "sbom.json not found!"
            exit 1
          }
          Write-Host "sbom.json created successfully"
        shell: powershell

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────
  # JOB 2: CapyCLI + Fossology + SW360 upload
  # ──────────────────────────────────────────────────────────
  sca-pipeline:
    name: "Map → Create → Scan → Upload → Validate"
    runs-on: self-hosted
    needs: generate-sbom

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          clean: true       # ensure fresh checkout on self-hosted runner
      - name: Clean stale workspace files
        run: |
          Remove-Item -Force -ErrorAction SilentlyContinue `
            mapped-sbom.json, created-sbom.json, sourced-sbom.json, `
            final-sbom.json, mapping-result.json, sbom.json
          Write-Host "Workspace cleaned"
        shell: powershell

      # ── Download SBOM from job 1 ───────────────────────────
      - name: Download SBOM artifact
        uses: actions/download-artifact@v4
        with:
          name: sbom

      # ── Clone CapyCLI fork ─────────────────────────────────
      - name: Checkout CapyCLI fork
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/capycli
          ref: feat/sw360/upload_reports
          path: ${{ env.CAPYCLI_DIR }}
          clean: true       # ensure fresh checkout, no stale files

      # ── Python + CapyCLI setup ─────────────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CapyCLI (force reinstall)
        run: |
          pip uninstall capycli -y
          pip install . --force-reinstall --no-cache-dir
        working-directory: ${{ env.CAPYCLI_DIR }}
        shell: powershell

      - name: Verify CapyCLI installation
        run: |
          Write-Host "=== Verifying capycli fixes ==="
          $mapBomPath = Join-Path ${{ env.CAPYCLI_DIR }} "capycli\bom\map_bom.py"
          $content = Get-Content $mapBomPath -Raw
          if ($content -match 'Incomplete mapping is acceptable') {
            Write-Host "OK: map_bom.py contains exit-0 fix"
          } else {
            Write-Host "ERROR: map_bom.py missing exit-0 fix - stale code!"
            exit 1
          }
          $createCompPath = Join-Path ${{ env.CAPYCLI_DIR }} "capycli\bom\create_components.py"
          $content2 = Get-Content $createCompPath -Raw
          if ($content2 -match 'Skipped.*400.*Bad Request') {
            Write-Host "OK: create_components.py contains 400-handling fix"
          } else {
            Write-Host "ERROR: create_components.py missing 400-handling fix - stale code!"
            exit 1
          }
          Write-Host "=== CapyCLI fixes verified ==="
        shell: powershell

      # ── Step 2: Map SBOM to SW360 ─────────────────────────
      - name: "Step 2 · Map SBOM to SW360"
        run: |
          python -m capycli bom map `
            -i sbom.json `
            -url ${{ vars.SW360_URL }} `
            -t ${{ secrets.SW360_TOKEN }} `
            -mr mapping-result.json `
            -o mapped-sbom.json `
            --matchmode full-search,all-versions `
            -v
        shell: powershell

      - name: Verify mapped SBOM
        run: |
          if (-not (Test-Path mapped-sbom.json)) {
            Write-Host "WARNING: mapped-sbom.json not found - Step 2 may have failed completely"
            exit 1
          }
          Write-Host "mapped-sbom.json created successfully"
        shell: powershell

      # ── Step 3a: Create missing components ────────────────
      - name: "Step 3a · Create missing components on SW360"
        continue-on-error: true
        run: |
          python -m capycli bom createcomponents `
            -i mapped-sbom.json `
            -o created-sbom.json `
            -url ${{ vars.SW360_URL }} `
            -t ${{ secrets.SW360_TOKEN }} `
            -v
        shell: powershell

      # ── Fallback: ensure created-sbom.json always exists ──
      - name: "Step 3a-fallback · Ensure created-sbom.json exists"
        run: |
          Write-Host "Checking workspace files..."
          Get-ChildItem -Path . -Filter "*.json" | Select-Object Name, Length
          if (-not (Test-Path created-sbom.json)) {
            Write-Host "created-sbom.json missing - copying mapped-sbom.json"
            Copy-Item mapped-sbom.json created-sbom.json
          }
          if (-not (Test-Path created-sbom.json)) {
            Write-Error "FATAL: created-sbom.json still missing after fallback!"
            exit 1
          }
          Write-Host "created-sbom.json verified ($(Get-Item created-sbom.json).Length bytes)"
        shell: powershell

      # ── Step 3b: Create missing releases ──────────────────
      - name: "Step 3b · Create missing releases on SW360"
        continue-on-error: true
        run: |
          python -m capycli bom createreleases `
            -i created-sbom.json `
            -o created-sbom.json `
            -url ${{ vars.SW360_URL }} `
            -t ${{ secrets.SW360_TOKEN }} `
            -v
        shell: powershell

      # ── Step 4: Create / update project (CapyCLI handles find-or-create) ──
      - name: "Step 4 · Create or update SW360 project"
        continue-on-error: true
        run: |
          python -m capycli project create `
            -i created-sbom.json `
            -url ${{ vars.SW360_URL }} `
            -t ${{ secrets.SW360_TOKEN }} `
            -name "${{ env.PROJECT_NAME }}" `
            -version "${{ env.PROJECT_VERSION }}" `
            -source had-radiologyplus-project-info.json `
            -v
        shell: powershell

      # ── Capture project ID (robust fallback chain) ────────────────────────
      - name: "Capture SW360 project ID"
        id: get-project-id
        run: |
          Write-Host "=== Capturing SW360 project ID ==="
          $projectId = $null

          # Method 1: Try capycli project find (search by name)
          Write-Host "Method 1: Searching via capycli project find..."
          $output = python -m capycli project find `
            -name "${{ env.PROJECT_NAME }}" `
            -url ${{ vars.SW360_URL }} `
            -t ${{ secrets.SW360_TOKEN }} 2>&1
          $null = $LASTEXITCODE  # Clear exit code from failed python command
          $match = ($output | Select-String -Pattern '([a-f0-9]{32})' -AllMatches)
          if ($match -and $match.Matches.Count -gt 0) {
            $projectId = $match.Matches.Groups[1].Value
            Write-Host "Found project ID via search: $projectId"
          }

          # Method 2: If search failed, query SW360 API directly
          if (-not $projectId) {
            Write-Host "Method 2: Querying SW360 API directly..."
            try {
              $token = "${{ secrets.SW360_TOKEN }}"
              $url = "${{ vars.SW360_URL }}"
              $searchUrl = "$url/resource/api/search?type=project&searchText=${{ env.PROJECT_NAME }}&pagination=0&elements=10"
              $response = Invoke-RestMethod -Uri $searchUrl -Headers @{
                "X-CSRF-Token" = "$token"
                "Authorization" = "Token $token"
              } -ErrorAction Stop

              if ($response._embedded -and $response._embedded."sw360:projects") {
                foreach ($proj in $response._embedded."sw360:projects") {
                  if ($proj.name -eq "${{ env.PROJECT_NAME }}" -and $proj.version -eq "${{ env.PROJECT_VERSION }}") {
                    $href = $proj._links.self.href
                    $projectId = $href.Split('/')[-1]
                    Write-Host "Found project ID via API: $projectId"
                    break
                  }
                }
              }
            } catch {
              Write-Host "API query failed: $($_.Exception.Message)"
            }
          }

          # Method 3: If all else fails, list all projects and find by name
          if (-not $projectId) {
            Write-Host "Method 3: Listing all projects..."
            try {
              $token = "${{ secrets.SW360_TOKEN }}"
              $url = "${{ vars.SW360_URL }}"
              $listUrl = "$url/resource/api/projects?pagination=0&elements=50"
              $response = Invoke-RestMethod -Uri $listUrl -Headers @{
                "X-CSRF-Token" = "$token"
                "Authorization" = "Token $token"
              } -ErrorAction Stop

              if ($response._embedded -and $response._embedded."sw360:projects") {
                foreach ($proj in $response._embedded."sw360:projects") {
                  if ($proj.name -eq "${{ env.PROJECT_NAME }}" -and $proj.version -eq "${{ env.PROJECT_VERSION }}") {
                    $href = $proj._links.self.href
                    $projectId = $href.Split('/')[-1]
                    Write-Host "Found project ID via listing: $projectId"
                    break
                  }
                }
              }
            } catch {
              Write-Host "Project listing failed: $($_.Exception.Message)"
            }
          }

          # Set output for downstream steps
          if ($projectId) {
            Write-Host "SUCCESS: Project ID = $projectId"
            Add-Content -Path $env:GITHUB_OUTPUT -Value "project_id=$projectId"
          } else {
            Write-Host "WARNING: Could not find project ID - will use name/version instead"
          }

          # Ensure step exits 0 (PowerShell may inherit exit code from failed python command)
          exit 0
        shell: powershell

      # ── Step 5: Download sources ───────────────────────────
      - name: "Step 5 · Download dependency sources"
        run: |
          if (-not (Test-Path ${{ env.SOURCE_DIR }})) {
            New-Item -ItemType Directory -Path ${{ env.SOURCE_DIR }} | Out-Null
          }
          python -m capycli bom downloadsources `
            -i created-sbom.json `
            -source ${{ env.SOURCE_DIR }} `
            -o sourced-sbom.json `
            -v
        shell: powershell

      # ── Step 6: Fossology scan (with per-dependency reports) ──
      - name: "Step 6 · Run FOSSology analysis"
        id: fossology
        continue-on-error: true
        uses: shatakshisgtiwari-jpg/fossology-action@feat/action/per-dependency-report
        with:
          scan_mode: "scan-only-deps"
          scanners: "ojo copyright"
          report_format: "SPDX_JSON"
          sbom_path: "created-sbom.json"
          per_dependency_report: "true"
          report_dir: ${{ env.REPORT_DIR }}

      # ── Step 7: Attach sources to releases ────────────────
      - name: "Step 7 · Attach source files to SW360 releases"
        run: |
          python -m capycli bom createreleases `
            -i sourced-sbom.json `
            -o final-sbom.json `
            -url ${{ vars.SW360_URL }} `
            -t ${{ secrets.SW360_TOKEN }} `
            -source ${{ env.SOURCE_DIR }} `
            -v
        shell: powershell

      # ── Step 8: Upload per-dependency scan reports ─────────
      - name: "Step 8 · Upload per-dependency scan reports to SW360"
        continue-on-error: true
        run: |
          $reportFiles = Get-ChildItem -Path ${{ env.REPORT_DIR }} -Filter "*.spdx.json" -Recurse -ErrorAction SilentlyContinue
          $reportCount = $reportFiles.Count
          Write-Host "Reports found: $reportCount"

          if ($reportCount -gt 0) {
            python -m capycli bom uploadreports `
              -i final-sbom.json `
              --report-dir ${{ env.REPORT_DIR }} `
              --filetype COMPONENT_LICENSE_INFO_XML `
              --comment "Fossology SPDX scan - ${{ env.PROJECT_NAME }} ${{ env.PROJECT_VERSION }}" `
              -url ${{ vars.SW360_URL }} `
              -t ${{ secrets.SW360_TOKEN }} `
              -o final-sbom.json `
              -v
          } else {
            Write-Host "WARNING: No .spdx.json reports found - skipping upload."
          }
        shell: powershell

      # ── Step 9: Validate process ───────────────────────────────────
      - name: "Step 9 · Validate pipeline completeness"
        run: |
          $idArg = @()
          $projectId = "${{ steps.get-project-id.outputs.project_id }}"
          if ($projectId) {
            $idArg = @("-id", $projectId)
          } else {
            $idArg = @("-name", "${{ env.PROJECT_NAME }}", "-version", "${{ env.PROJECT_VERSION }}")
          }

          python -m capycli project prerequisites `
            -i final-sbom.json `
            @idArg `
            -url ${{ vars.SW360_URL }} `
            -t ${{ secrets.SW360_TOKEN }} `
            --forceerror `
            -v
        shell: powershell

      # ── Upload all artifacts ────────────────────────────────
      - name: Upload SBOM artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-artifacts
          path: |
            mapped-sbom.json
            created-sbom.json
            sourced-sbom.json
            final-sbom.json

      - name: Upload Fossology reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fossology-reports
          path: |
            results/
            ${{ env.REPORT_DIR }}/
          if-no-files-found: warn
