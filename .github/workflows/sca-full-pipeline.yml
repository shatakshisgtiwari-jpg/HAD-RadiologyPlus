name: SCA Full Pipeline — had-radiologyplus (Linux)

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'Backend/**'
      - 'FrontEnd/package.json'
      - 'FrontEnd/package-lock.json'
      - 'pom.xml'
      - 'allowlist.json'
      - '.github/workflows/sca-full-pipeline.yml'
  workflow_dispatch:    # manual trigger needed

permissions:
  contents: read
  actions: write

env:
  PROJECT_NAME: had-radiologyplus
  PROJECT_VERSION: "1.0.0"
  CAPYCLI_DIR: capycli-fork
  REPORT_DIR: per-dependency-reports
  SOURCE_DIR: sources

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # JOB 1: Generate SBOM with cdxgen
  # ────────────────────────────────────────────────────────────────────────────
  generate-sbom:
    name: "Step 1 · Generate CycloneDX SBOM"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache cdxgen
        id: cache-cdxgen
        uses: actions/cache@v4
        with:
          path: ~/.npm-global/lib/node_modules/@cyclonedx/cdxgen
          key: cdxgen-${{ runner.os }}

      - name: Install cdxgen
        if: steps.cache-cdxgen.outputs.cache-hit != 'true'
        run: npm install -g @cyclonedx/cdxgen

      - name: Generate SBOM
        run: cdxgen -r -o sbom.json --spec-version 1.6 --format json

      - name: Verify SBOM was created
        run: |
          if [ ! -f sbom.json ]; then
            echo "::error::sbom.json not found!"
            exit 1
          fi
          comp_count=$(jq '.components | length' sbom.json)
          with_urls=$(jq '[.components[] | select(.externalReferences[]?.comment == "source archive (download location)" or .externalReferences[]?.comment == "binary (download location)")] | length' sbom.json)
          echo "sbom.json created successfully - $comp_count components, $with_urls with download URLs"

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
          if-no-files-found: error

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 2: Map SBOM to SW360
  # ────────────────────────────────────────────────────────────────────────────
  map-to-sw360:
    name: "Step 2 · Map to SW360"
    runs-on: ubuntu-latest
    needs: generate-sbom
    timeout-minutes: 60

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Download SBOM artifact
        uses: actions/download-artifact@v4
        with:
          name: sbom

      - name: Checkout CapyCLI fork
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/capycli
          ref: feat/sw360/upload_reports
          path: ${{ env.CAPYCLI_DIR }}
          clean: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CapyCLI (if needed)
        run: |
          if ! pip list 2>/dev/null | grep -q "^capycli "; then
            echo "Installing CapyCLI..."
            pip install . --force-reinstall
            if [ $? -ne 0 ]; then exit 1; fi
          else
            echo "CapyCLI already installed"
          fi
        working-directory: ${{ env.CAPYCLI_DIR }}

      - name: Map SBOM to SW360
        run: |
          python -m capycli bom map \
            -i sbom.json \
            -url ${{ vars.SW360_URL }} \
            -t ${{ secrets.SW360_TOKEN }} \
            -mr mapping-result.json \
            -o mapped-sbom.json \
            --matchmode full-search,all-versions \
            -v

      - name: Verify mapped SBOM
        run: |
          if [ ! -f mapped-sbom.json ]; then
            echo "ERROR: mapped-sbom.json not found"
            exit 1
          fi
          echo "mapped-sbom.json created successfully"

      # Upload mapping results for debugging
      - name: Upload mapping results (debug)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mapping-result
          path: mapping-result.json

      # ── Inline Step 3: Create missing components & releases ──

      - name: Create missing components
        run: |
          python -m capycli bom createcomponents \
            -i mapped-sbom.json \
            -o created-sbom.json \
            -url ${{ vars.SW360_URL }} \
            -t ${{ secrets.SW360_TOKEN }} \
            --download \
            -v

      - name: Create missing releases
        run: |
          python -m capycli bom createreleases \
            -i created-sbom.json \
            -o created-sbom.json \
            -url ${{ vars.SW360_URL }} \
            -t ${{ secrets.SW360_TOKEN }} \
            -v

      - name: Verify created SBOM
        run: |
          if [ ! -f created-sbom.json ]; then
            echo "ERROR: created-sbom.json not found"
            exit 1
          fi
          size=$(stat -c%s created-sbom.json)
          echo "created-sbom.json created successfully ($size bytes)"

      - name: Upload created SBOM
        uses: actions/upload-artifact@v4
        with:
          name: created-sbom
          path: created-sbom.json

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 3: Create/update SW360 project + Capture project ID
  # ────────────────────────────────────────────────────────────────────────────
  create-project:
    name: "Step 3 · Create/update SW360 project"
    runs-on: ubuntu-latest
    needs: map-to-sw360
    timeout-minutes: 30

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Download created SBOM
        uses: actions/download-artifact@v4
        with:
          name: created-sbom

      - name: Checkout CapyCLI fork
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/capycli
          ref: feat/sw360/upload_reports
          path: ${{ env.CAPYCLI_DIR }}
          clean: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CapyCLI (if needed)
        run: |
          if ! pip list 2>/dev/null | grep -q "^capycli "; then
            echo "Installing CapyCLI..."
            pip install . --force-reinstall
            if [ $? -ne 0 ]; then exit 1; fi
          else
            echo "CapyCLI already installed"
          fi
        working-directory: ${{ env.CAPYCLI_DIR }}

      - name: Create or update SW360 project
        run: |
          python -m capycli project create \
            -i created-sbom.json \
            -url ${{ vars.SW360_URL }} \
            -t ${{ secrets.SW360_TOKEN }} \
            -name "${{ env.PROJECT_NAME }}" \
            -version "${{ env.PROJECT_VERSION }}" \
            -source had-radiologyplus-project-info.json \
            -v

      - name: Capture SW360 project ID
        id: get-project-id
        run: |
          echo "=== Capturing SW360 project ID ==="
          project_id=""

          # Method 1: Try capycli project find (search by name)
          echo "Method 1: Searching via capycli project find..."
          output=$(python -m capycli project find \
            -name "${{ env.PROJECT_NAME }}" \
            -url ${{ vars.SW360_URL }} \
            -t ${{ secrets.SW360_TOKEN }} 2>&1)
          match=$(echo "$output" | grep -oP '[a-f0-9]{32}' | head -1)
          if [ -n "$match" ]; then
            project_id="$match"
            echo "Found project ID via search: $project_id"
          fi

          # Method 2: Query SW360 API directly
          if [ -z "$project_id" ]; then
            echo "Method 2: Querying SW360 API directly..."
            token="${{ secrets.SW360_TOKEN }}"
            url="${{ vars.SW360_URL }}"
            search_url="$url/resource/api/search?type=project&searchText=${{ env.PROJECT_NAME }}&pagination=0&elements=10"
            response=$(curl -s -f -H "X-CSRF-Token: $token" -H "Authorization: Token $token" "$search_url" 2>/dev/null) || true
            if [ -n "$response" ]; then
              project_id=$(echo "$response" | jq -r --arg name "${{ env.PROJECT_NAME }}" --arg ver "${{ env.PROJECT_VERSION }}" '
                ._embedded["sw360:projects"][] | select(.name == $name and .version == $ver) | ._links.self.href | split("/")[-1]' 2>/dev/null)
              if [ -n "$project_id" ]; then
                echo "Found project ID via API: $project_id"
              fi
            fi
          fi

          # Method 3: List all projects
          if [ -z "$project_id" ]; then
            echo "Method 3: Listing all projects..."
            token="${{ secrets.SW360_TOKEN }}"
            url="${{ vars.SW360_URL }}"
            list_url="$url/resource/api/projects?pagination=0&elements=50"
            response=$(curl -s -f -H "X-CSRF-Token: $token" -H "Authorization: Token $token" "$list_url" 2>/dev/null) || true
            if [ -n "$response" ]; then
              project_id=$(echo "$response" | jq -r --arg name "${{ env.PROJECT_NAME }}" --arg ver "${{ env.PROJECT_VERSION }}" '
                ._embedded["sw360:projects"][] | select(.name == $name and .version == $ver) | ._links.self.href | split("/")[-1]' 2>/dev/null)
              if [ -n "$project_id" ]; then
                echo "Found project ID via listing: $project_id"
              fi
            fi
          fi

          if [ -n "$project_id" ]; then
            echo "SUCCESS: Project ID = $project_id"
            echo "project_id=$project_id" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: Could not find project ID"
            exit 1
          fi

      - name: Save project ID to file
        run: |
          echo "${{ steps.get-project-id.outputs.project_id }}" > project-id.txt

      - name: Upload project ID
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: project-id
          path: project-id.txt

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 4: Filter SBOM by clearing state
  # ────────────────────────────────────────────────────────────────────────────
  filter-by-clearing-state:
    name: "Step 4 · Filter by clearing state"
    runs-on: ubuntu-latest
    needs: map-to-sw360
    timeout-minutes: 30

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Download created SBOM
        uses: actions/download-artifact@v4
        with:
          name: created-sbom

      - name: Filter SBOM by clearing state
        run: |
          sw360_url="${{ vars.SW360_URL }}"
          token="${{ secrets.SW360_TOKEN }}"
          sbom_path="created-sbom.json"
          out_path="filtered-sbom.json"

          total=$(jq '.components | length' "$sbom_path")
          echo "=== Filtering $total components by clearing state ==="

          # Build a jq filter script that checks clearing state for each component
          # We'll process components one by one using curl + jq
          included="[]"
          skipped="[]"
          errors="[]"

          # Read component list into a variable for iteration
          comp_count=$(jq '.components | length' "$sbom_path")

          for i in $(seq 0 $((comp_count - 1))); do
            comp=$(jq ".components[$i]" "$sbom_path")
            name=$(echo "$comp" | jq -r '.name')
            version=$(echo "$comp" | jq -r '.version // "unknown"')
            sw360_id=$(echo "$comp" | jq -r '.properties[]? | select(.name == "siemens:sw360Id") | .value' 2>/dev/null)

            if [ -z "$sw360_id" ] || [ "$sw360_id" = "null" ]; then
              # No SW360 ID — new/unmapped component, include it
              included=$(echo "$included" | jq ". + [$comp]")
              echo "  [INCLUDE] $name@$version (no SW360 ID)"
              continue
            fi

            # Query SW360 for clearing state
            release_url="$sw360_url/resource/api/releases/$sw360_id"
            response=$(curl -s -H "Authorization: Token $token" "$release_url" 2>/dev/null) || true

            if [ -z "$response" ]; then
              # Query failed — include to be safe
              included=$(echo "$included" | jq ". + [$comp]")
              errors=$(echo "$errors" | jq ". + [$comp]")
              echo "  [INCLUDE] $name@$version - query error"
              continue
            fi

            clearing_state=$(echo "$response" | jq -r '.clearingState // empty')

            if [ -z "$clearing_state" ]; then
              # No clearing state set — needs clearing
              included=$(echo "$included" | jq ". + [$comp]")
              echo "  [INCLUDE] $name@$version (no clearing state)"
            elif [ "$clearing_state" = "REPORT_AVAILABLE" ] || [ "$clearing_state" = "APPROVED" ]; then
              skipped=$(echo "$skipped" | jq ". + [$comp]")
              echo "  [SKIP]    $name@$version - clearingState=$clearing_state"
            else
              # NEW_CLEARING, SENT_TO_CLEARING_TOOL, UNDER_CLEARING — needs clearing
              included=$(echo "$included" | jq ". + [$comp]")
              echo "  [INCLUDE] $name@$version - clearingState=$clearing_state"
            fi
          done

          # Build filtered SBOM with included components
          jq --argjson included "$included" '.components = $included' "$sbom_path" > "$out_path.tmp"

          # Build set of included bom-refs for dependency filtering
          included_refs=$(echo "$included" | jq '[.[]."bom-ref"]')

          # Filter dependencies
          jq --argjson included_refs "$included_refs" '
            if .dependencies then
              .dependencies = [
                .dependencies[] | select(.ref as $r | $included_refs | index($r) != null) |
                if .dependsOn then
                  .dependsOn = [.dependsOn[] | select(. as $c | $included_refs | index($c) != null)]
                else . end |
                select((.dependsOn | length) > 0 or (.dependsOn == null))
              ]
            else . end
          ' "$out_path.tmp" > "$out_path"
          rm -f "$out_path.tmp"

          included_count=$(echo "$included" | jq 'length')
          skipped_count=$(echo "$skipped" | jq 'length')
          errors_count=$(echo "$errors" | jq 'length')

          echo ""
          echo "=== Filtering Summary ==="
          echo "Total components:     $total"
          echo "Included (need scan): $included_count"
          echo "Skipped (already cleared): $skipped_count"
          echo "Query errors:         $errors_count"
          echo "Filtered SBOM saved to: $out_path ($(stat -c%s "$out_path") bytes)"

      - name: Verify filtered SBOM
        run: |
          if [ ! -f filtered-sbom.json ]; then
            echo "ERROR: filtered-sbom.json not found"
            exit 1
          fi
          comp_count=$(jq '.components | length' filtered-sbom.json)
          echo "filtered-sbom.json created - $comp_count components remaining"

      - name: Upload filtered SBOM
        uses: actions/upload-artifact@v4
        with:
          name: filtered-sbom
          path: filtered-sbom.json

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 5: Download sources + FOSSology scan
  # ────────────────────────────────────────────────────────────────────────────
  scan-fossology:
    name: "Step 5 · Download sources & Scan"
    runs-on: ubuntu-latest
    needs: filter-by-clearing-state
    timeout-minutes: 120

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Download filtered SBOM
        uses: actions/download-artifact@v4
        with:
          name: filtered-sbom

      - name: Checkout CapyCLI fork
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/capycli
          ref: feat/sw360/upload_reports
          path: ${{ env.CAPYCLI_DIR }}
          clean: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CapyCLI (if needed)
        run: |
          if ! pip list 2>/dev/null | grep -q "^capycli "; then
            echo "Installing CapyCLI..."
            pip install . --force-reinstall
            if [ $? -ne 0 ]; then exit 1; fi
          else
            echo "CapyCLI already installed"
          fi
        working-directory: ${{ env.CAPYCLI_DIR }}

      # Download sources using capycli, then merge sw360Ids back
      - name: Download dependency sources
        run: |
          sbom_path="filtered-sbom.json"
          source_dir="${{ env.SOURCE_DIR }}"
          out_sbom="sourced-sbom.json"

          mkdir -p "$source_dir"

          echo "=== Updating SBOM with local file paths ==="
          python -m capycli bom downloadsources \
            -i "$sbom_path" \
            -source "$source_dir" \
            -o "$out_sbom" \
            -v

          # capycli bom downloadsources does NOT preserve custom properties
          # like siemens:sw360Id. Merge them back from the input SBOM.
          echo "=== Restoring sw360Ids from input SBOM ==="

          # Build lookup: name@version → sw360Id from input
          id_map=$(jq '[.components[] | {key: "\(.name)@\(.version)", id: (.properties[]? | select(.name == "siemens:sw360Id") | .value)}] | from_entries' "$sbom_path")
          id_count=$(echo "$id_map" | jq 'length')
          echo "Found $id_count sw360Ids in input SBOM"

          # Apply sw360Ids to output SBOM components
          jq --argjson id_map "$id_map" '
            .components |= map(
              .key = "\(.name)@\(.version)" |
              if $id_map[.key] and (.properties | any(.name == "siemens:sw360Id") | not) then
                .properties += [{"name": "siemens:sw360Id", "value": $id_map[.key]}]
              else . end |
              del(.key)
            )
          ' "$out_sbom" > "${out_sbom}.tmp" && mv "${out_sbom}.tmp" "$out_sbom"

          restored=$(jq '[.components[] | .properties[]? | select(.name == "siemens:sw360Id")] | length' "$out_sbom")
          echo "Restored sw360Ids to output SBOM (total components with sw360Id: $restored)"
          echo "Updated $out_sbom with sw360Ids preserved"

      - name: Verify sourced SBOM
        run: |
          if [ ! -f sourced-sbom.json ]; then
            echo "ERROR: sourced-sbom.json not found"
            exit 1
          fi
          size=$(stat -c%s sourced-sbom.json)
          echo "sourced-sbom.json created successfully ($size bytes)"

      - name: Run FOSSology analysis
        id: fossology
        uses: shatakshisgtiwari-jpg/fossology-action@feat/action/per-dependency-report
        with:
          scan_mode: "scan-only-deps"
          scanners: "ojo copyright"
          report_format: "SPDX_JSON"
          sbom_path: "filtered-sbom.json"
          per_dependency_report: "true"
          report_dir: ${{ env.REPORT_DIR }}

      - name: Verify FOSSology output
        run: |
          if [ ! -f "results/sbom_spdx.json" ]; then
            echo "ERROR: results/sbom_spdx.json not found"
            exit 1
          fi
          size=$(stat -c%s "results/sbom_spdx.json")
          echo "OK: results/sbom_spdx.json exists ($size bytes)"
          report_files=$(find ${{ env.REPORT_DIR }} -name "*.spdx.json" -type f 2>/dev/null | wc -l)
          echo "Per-dependency reports: $report_files"
          if [ "$report_files" -eq 0 ]; then
            echo "WARNING: No per-dependency reports generated - will use consolidated report only"
          fi

      - name: Upload scan artifacts
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: scan-artifacts
          path: |
            sourced-sbom.json
            results/
            ${{ env.REPORT_DIR }}/

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 6: Upload sources & reports to SW360
  # ────────────────────────────────────────────────────────────────────────────
  upload-to-sw360:
    name: "Step 6 · Upload to SW360"
    runs-on: ubuntu-latest
    needs: scan-fossology
    timeout-minutes: 120

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Download scan artifacts
        uses: actions/download-artifact@v4
        with:
          name: scan-artifacts
          path: scan-output

      - name: Checkout CapyCLI fork
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/capycli
          ref: feat/sw360/upload_reports
          path: ${{ env.CAPYCLI_DIR }}
          clean: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CapyCLI (if needed)
        run: |
          if ! pip list 2>/dev/null | grep -q "^capycli "; then
            echo "Installing CapyCLI..."
            pip install . --force-reinstall
            if [ $? -ne 0 ]; then exit 1; fi
          else
            echo "CapyCLI already installed"
          fi
        working-directory: ${{ env.CAPYCLI_DIR }}

      - name: Restore files to working directory
        run: |
          cp "scan-output/sourced-sbom.json" "sourced-sbom.json"
          [ -d "scan-output/results" ] && cp -r "scan-output/results" .
          [ -d "scan-output/${{ env.REPORT_DIR }}" ] && cp -r "scan-output/${{ env.REPORT_DIR }}" .
          [ -d "scan-output/sources" ] && cp -r "scan-output/sources" .

      - name: Attach source files to SW360 releases
        run: |
          python -m capycli bom createreleases \
            -i sourced-sbom.json \
            -o final-sbom.json \
            -url ${{ vars.SW360_URL }} \
            -t ${{ secrets.SW360_TOKEN }} \
            -source ${{ env.SOURCE_DIR }} \
            -v

      - name: Restore sw360Ids in final SBOM
        run: |
          # capycli bom createreleases may drop custom properties like
          # siemens:sw360Id. Merge them back from sourced-sbom.json.
          echo "=== Restoring sw360Ids in final-sbom.json ==="

          id_map=$(jq '[.components[] | {key: "\(.name)@\(.version)", id: (.properties[]? | select(.name == "siemens:sw360Id") | .value)}] | from_entries' "sourced-sbom.json")
          id_count=$(echo "$id_map" | jq 'length')
          echo "Found $id_count sw360Ids in sourced-sbom.json"

          jq --argjson id_map "$id_map" '
            .components |= map(
              .key = "\(.name)@\(.version)" |
              if $id_map[.key] and (.properties | any(.name == "siemens:sw360Id") | not) then
                .properties += [{"name": "siemens:sw360Id", "value": $id_map[.key]}]
              else . end |
              del(.key)
            )
          ' "final-sbom.json" > "final-sbom.json.tmp" && mv "final-sbom.json.tmp" "final-sbom.json"

          with_ids=$(jq '[.components[] | select(.properties[]?.name == "siemens:sw360Id")] | length' "final-sbom.json")
          echo "final-sbom.json updated with sw360Ids preserved ($with_ids components with sw360Id)"

      - name: Verify final SBOM
        run: |
          if [ ! -f final-sbom.json ]; then
            echo "ERROR: final-sbom.json not found"
            exit 1
          fi
          size=$(stat -c%s final-sbom.json)
          with_ids=$(jq '[.components[] | select(.properties[]?.name == "siemens:sw360Id")] | length' final-sbom.json)
          echo "final-sbom.json created successfully ($size bytes, $with_ids components with sw360Id)"

      # Upload per-dependency scan reports to SW360
      - name: Upload per-dependency scan reports to SW360
        run: |
          report_files=$(find ${{ env.REPORT_DIR }} -name "*.spdx.json" -type f 2>/dev/null)
          report_count=$(echo "$report_files" | wc -l)
          echo "Per-dependency reports found: $report_count"

          if [ "$report_count" -gt 0 ]; then
            max_retries=3
            retry_delay=30
            last_exit=0

            for attempt in $(seq 1 $max_retries); do
              echo "=== Upload attempt $attempt of $max_retries ==="
              python -m capycli bom uploadreports \
                -i final-sbom.json \
                --report-dir ${{ env.REPORT_DIR }} \
                --filetype COMPONENT_LICENSE_INFO_XML \
                --comment "Fossology SPDX scan - ${{ env.PROJECT_NAME }} ${{ env.PROJECT_VERSION }}" \
                -url ${{ vars.SW360_URL }} \
                -t ${{ secrets.SW360_TOKEN }} \
                -o final-sbom.json \
                -v
              last_exit=$?

              if [ "$last_exit" -eq 0 ]; then
                echo "Upload completed successfully on attempt $attempt"
                break
              else
                echo "Upload failed (exit code $last_exit) on attempt $attempt"
                if [ "$attempt" -lt "$max_retries" ]; then
                  echo "Retrying in $retry_delay seconds..."
                  sleep "$retry_delay"
                fi
              fi
            done

            if [ "$last_exit" -ne 0 ]; then
              echo "::warning::Per-dependency upload failed after $max_retries attempts (exit code $last_exit)"
            fi
          else
            echo "WARNING: No per-dependency reports found - skipping per-dependency upload"
          fi

      # Also upload the consolidated report as a fallback
      - name: Upload consolidated scan report to SW360
        run: |
          if [ -f "results/sbom_spdx.json" ]; then
            echo "Uploading consolidated report to all releases..."
            max_retries=3
            retry_delay=30
            last_exit=0

            for attempt in $(seq 1 $max_retries); do
              echo "=== Consolidated upload attempt $attempt of $max_retries ==="
              python -m capycli bom uploadreports \
                -i final-sbom.json \
                --report-file results/sbom_spdx.json \
                --filetype COMPONENT_LICENSE_INFO_XML \
                --comment "Consolidated Fossology SPDX scan - ${{ env.PROJECT_NAME }} ${{ env.PROJECT_VERSION }}" \
                -url ${{ vars.SW360_URL }} \
                -t ${{ secrets.SW360_TOKEN }} \
                -o final-sbom.json \
                -v
              last_exit=$?

              if [ "$last_exit" -eq 0 ]; then
                echo "Consolidated upload completed successfully on attempt $attempt"
                break
              else
                echo "Consolidated upload failed (exit code $last_exit) on attempt $attempt"
                if [ "$attempt" -lt "$max_retries" ]; then
                  echo "Retrying in $retry_delay seconds..."
                  sleep "$retry_delay"
                fi
              fi
            done

            if [ "$last_exit" -ne 0 ]; then
              echo "::warning::Consolidated report upload failed after $max_retries attempts (exit code $last_exit)"
            fi
          else
            echo "WARNING: Consolidated report not found - skipping"
          fi

      - name: Upload final SBOM
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: final-sbom
          path: final-sbom.json

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 7: Validate pipeline completeness
  # ────────────────────────────────────────────────────────────────────────────
  validate-pipeline:
    name: "Step 7 · Validate pipeline"
    runs-on: ubuntu-latest
    needs: upload-to-sw360
    timeout-minutes: 30

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Download final SBOM
        uses: actions/download-artifact@v4
        with:
          name: final-sbom

      - name: Download project ID
        uses: actions/download-artifact@v4
        with:
          name: project-id

      - name: Checkout CapyCLI fork
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/capycli
          ref: feat/sw360/upload_reports
          path: ${{ env.CAPYCLI_DIR }}
          clean: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CapyCLI (if needed)
        run: |
          if ! pip list 2>/dev/null | grep -q "^capycli "; then
            echo "Installing CapyCLI..."
            pip install . --force-reinstall
            if [ $? -ne 0 ]; then exit 1; fi
          else
            echo "CapyCLI already installed"
          fi
        working-directory: ${{ env.CAPYCLI_DIR }}

      - name: Validate pipeline completeness
        run: |
          project_id=$(cat project-id.txt | tr -d '[:space:]')
          if [ -z "$project_id" ]; then
            echo "ERROR: Project ID not available"
            exit 1
          fi

          python -m capycli project prerequisites \
            -i final-sbom.json \
            -id "$project_id" \
            -url ${{ vars.SW360_URL }} \
            -t ${{ secrets.SW360_TOKEN }} \
            --check-reports \
            --forceerror \
            -v

      - name: Upload all final artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: all-sbom-artifacts
          path: |
            final-sbom.json

      - name: Upload FOSSology reports
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: fossology-reports
          path: |
            results/
            ${{ env.REPORT_DIR }}/
          if-no-files-found: warn
