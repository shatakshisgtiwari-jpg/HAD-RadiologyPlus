# ──────────────────────────────────────────────────────────────────────────────
# SCA Full Pipeline — had-radiologyplus
#
# Generates a CycloneDX SBOM, enriches it with source URLs, maps to SW360,
# creates missing components/releases, runs FOSSology scans (per-dependency),
# uploads all artifacts to SW360, and validates completeness.
#
# Key improvements over the original:
#   1. SBOM enrichment via `capycli bom findsources` adds download URLs
#      (fixes the root cause of poor map/create results)
#   2. GitHub token provided to avoid API rate limiting (5,000 req/hr)
#      - GH_NAME stored in vars (non-sensitive, like SW360_URL)
#      - GH_TOKEN stored in secrets (sensitive, like SW360_TOKEN)
#   3. Removed the dangerous "Trim SBOM to first 5 packages" test step
#      (was a workaround for timeouts — now fixed at the root)
#   4. `--download` flag on createcomponents downloads sources from URLs
#   5. Consolidated report uploaded alongside per-dependency reports
#   6. Better timeout handling and error reporting
# ──────────────────────────────────────────────────────────────────────────────

name: SCA Full Pipeline — had-radiologyplus

on:
  push:
    branches: [ main, master, develop ]
  workflow_dispatch:    # manual trigger

permissions:
  contents: read
  actions: write

env:
  PROJECT_NAME: had-radiologyplus
  PROJECT_VERSION: "1.0.0"
  CAPYCLI_DIR: capycli-fork
  REPORT_DIR: per-dependency-reports
  SOURCE_DIR: sources
  # Increase the default timeout for steps that make many API calls
  # (findsources, map, createcomponents all talk to external services)
  STEP_TIMEOUT_MINUTES: 30

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # JOB 1: Generate SBOM + Enrich with source URLs
  # ────────────────────────────────────────────────────────────────────────────
  generate-sbom:
    name: "Step 1 · Generate & enrich CycloneDX SBOM"
    runs-on: self-hosted

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install Maven
        run: |
          if (-not (Get-Command mvn -ErrorAction SilentlyContinue)) {
            Write-Host "Installing Maven..."
            Invoke-WebRequest -Uri "https://repo1.maven.org/maven2/org/apache/maven/apache-maven/3.9.9/apache-maven-3.9.9-bin.zip" `
              -OutFile maven.zip
            Expand-Archive maven.zip -DestinationPath $env:USERPROFILE\.maven -Force
            Remove-Item maven.zip
            $mavenHome = (Get-ChildItem $env:USERPROFILE\.maven\apache-maven* -Directory).FullName
            [Environment]::SetEnvironmentVariable("MAVEN_HOME", $mavenHome, "Process")
            [Environment]::SetEnvironmentVariable("PATH", "$mavenHome\bin;$env:PATH", "Process")
          }
          Write-Host "Maven version:"
          mvn -version
        shell: powershell

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install cdxgen
        run: npm install -g @cyclonedx/cdxgen

      - name: Generate SBOM
        run: cdxgen -r -o sbom.json --spec-version 1.6 --format json

      - name: Verify SBOM was created
        run: |
          if (-not (Test-Path sbom.json)) {
            Write-Error "sbom.json not found!"
            exit 1
          }
          $compCount = (Get-Content sbom.json | ConvertFrom-Json).components.Count
          Write-Host "sbom.json created successfully - $compCount components"
        shell: powershell

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
          if-no-files-found: error

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 2: Enrich SBOM with source URLs + Map to SW360
  #
  # The CycloneDX Action generates an SBOM WITHOUT download URLs.
  # This causes cascading failures:
  #   - `bom map` cannot match by file hash or filename
  #   - `create component` sets empty sourceCodeDownloadurl in SW360
  #   - FOSSology has no URLs to download sources
  #
  # Fix: Run `capycli bom findsources` FIRST to enrich the SBOM with
  # source download URLs from GitHub/npm/PyPI/crates.io before mapping.
  # ────────────────────────────────────────────────────────────────────────────
  enrich-and-map:
    name: "Step 2 · Enrich URLs + Map to SW360"
    runs-on: self-hosted
    needs: generate-sbom

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Download SBOM artifact
        uses: actions/download-artifact@v4
        with:
          name: sbom

      - name: Checkout CapyCLI fork
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/capycli
          ref: feat/sw360/upload_reports
          path: ${{ env.CAPYCLI_DIR }}
          clean: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CapyCLI (force reinstall)
        run: |
          pip uninstall capycli -y
          pip install . --force-reinstall --no-cache-dir
        working-directory: ${{ env.CAPYCLI_DIR }}
        shell: powershell

      # ── Enrichment: Add source download URLs to the bare CycloneDX SBOM ──
      # Without this step, `findsources` falls through to GitHub name-search
      # for every component (slow, rate-limited, unreliable).
      # With a GitHub token, it gets 5,000 API calls/hour instead of 60.
      - name: Enrich SBOM with source download URLs
        timeout-minutes: ${{ fromJSON(env.STEP_TIMEOUT_MINUTES) }}
        run: |
          Write-Host "=== Enriching SBOM with source download URLs ==="
          Write-Host "This queries GitHub/npm/PyPI/crates.io for each component"
          Write-Host "GitHub token configured: $($env:GH_TOKEN -ne '')"

          python -m capycli bom findsources `
            -i sbom.json `
            -o enriched-sbom.json `
            -name "${{ vars.GH_NAME }}" `
            -gt "${{ secrets.GH_TOKEN }}" `
            -v
        shell: powershell
        env:
          # Pass GitHub credentials to avoid anonymous rate limits (60/hr)
          # Without these, enrichment will fail for projects with >50 deps
          GH_NAME: ${{ vars.GH_NAME }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Verify enriched SBOM
        run: |
          if (-not (Test-Path enriched-sbom.json)) {
            Write-Host "ERROR: enriched-sbom.json not found"
            exit 1
          }
          # Count how many components now have source URLs
          $sbom = Get-Content enriched-sbom.json | ConvertFrom-Json
          $total = $sbom.components.Count
          $withUrls = 0
          foreach ($comp in $sbom.components) {
            $hasUrl = $false
            foreach ($ref in $comp.externalReferences) {
              if ($ref.comment -eq "source archive (download location)") {
                $hasUrl = $true
                break
              }
            }
            if ($hasUrl) { $withUrls++ }
          }
          Write-Host "Enriched SBOM: $withUrls / $total components have source URLs"
          if ($withUrls -eq 0) {
            Write-Host "WARNING: No source URLs found - check GitHub token and network"
          }
        shell: powershell

      # ── Map enriched SBOM to SW360 ──
      # With source URLs now present, matching is more reliable:
      #   1. PURL match (fastest)
      #   2. Source file hash match (now possible because URLs exist)
      #   3. Name + version match
      #   4. Filename match (now possible because URLs exist)
      - name: Map SBOM to SW360
        timeout-minutes: ${{ fromJSON(env.STEP_TIMEOUT_MINUTES) }}
        run: |
          python -m capycli bom map `
            -i enriched-sbom.json `
            -url ${{ vars.SW360_URL }} `
            -t ${{ secrets.SW360_TOKEN }} `
            -mr mapping-result.json `
            -o mapped-sbom.json `
            --matchmode full-search,all-versions `
            -v
        shell: powershell

      - name: Verify mapped SBOM
        run: |
          if (-not (Test-Path mapped-sbom.json)) {
            Write-Host "ERROR: mapped-sbom.json not found"
            exit 1
          }
          Write-Host "mapped-sbom.json created successfully"
        shell: powershell

      - name: Upload mapped SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mapped-sbom
          path: |
            mapped-sbom.json
            mapping-result.json

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 3: Create missing components & releases on SW360
  #
  # Uses `--download` flag to automatically download source files from the
  # URLs that were added during enrichment (Step 2). This populates the
  # sourceCodeDownloadurl field in SW360 for every release.
  # ────────────────────────────────────────────────────────────────────────────
  create-components:
    name: "Step 3 · Create components & releases"
    runs-on: self-hosted
    needs: enrich-and-map

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Download mapped SBOM
        uses: actions/download-artifact@v4
        with:
          name: mapped-sbom

      - name: Checkout CapyCLI fork
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/capycli
          ref: feat/sw360/upload_reports
          path: ${{ env.CAPYCLI_DIR }}
          clean: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CapyCLI (force reinstall)
        run: |
          pip uninstall capycli -y
          pip install . --force-reinstall --no-cache-dir
        working-directory: ${{ env.CAPYCLI_DIR }}
        shell: powershell

      # Create missing components first, then releases.
      # The `--download` flag downloads source files from the enriched URLs
      # and uploads them as SOURCE attachments to SW360.
      - name: Create missing components
        timeout-minutes: ${{ fromJSON(env.STEP_TIMEOUT_MINUTES) }}
        run: |
          python -m capycli bom createcomponents `
            -i mapped-sbom.json `
            -o created-sbom.json `
            -url ${{ vars.SW360_URL }} `
            -t ${{ secrets.SW360_TOKEN }} `
            --download `
            -v
        shell: powershell

      - name: Create missing releases
        timeout-minutes: ${{ fromJSON(env.STEP_TIMEOUT_MINUTES) }}
        run: |
          python -m capycli bom createreleases `
            -i created-sbom.json `
            -o created-sbom.json `
            -url ${{ vars.SW360_URL }} `
            -t ${{ secrets.SW360_TOKEN }} `
            -v
        shell: powershell

      - name: Verify created SBOM
        run: |
          if (-not (Test-Path created-sbom.json)) {
            Write-Host "ERROR: created-sbom.json not found"
            exit 1
          }
          $size = (Get-Item created-sbom.json).Length
          Write-Host "created-sbom.json created successfully ($size bytes)"
        shell: powershell

      - name: Upload created SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: created-sbom
          path: created-sbom.json

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 4: Create/update SW360 project + Capture project ID
  # ────────────────────────────────────────────────────────────────────────────
  create-project:
    name: "Step 4 · Create/update SW360 project"
    runs-on: self-hosted
    needs: create-components

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Download created SBOM
        uses: actions/download-artifact@v4
        with:
          name: created-sbom

      - name: Checkout CapyCLI fork
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/capycli
          ref: feat/sw360/upload_reports
          path: ${{ env.CAPYCLI_DIR }}
          clean: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CapyCLI (force reinstall)
        run: |
          pip uninstall capycli -y
          pip install . --force-reinstall --no-cache-dir
        working-directory: ${{ env.CAPYCLI_DIR }}
        shell: powershell

      # ── REMOVED: "Trim SBOM to first 5 packages" test step ──
      # This was a workaround for container timeouts caused by missing URLs.
      # Now that Step 2 enriches the SBOM with source URLs, the API calls
      # are faster and more reliable. The root cause is fixed.

      - name: Create or update SW360 project
        run: |
          python -m capycli project create `
            -i created-sbom.json `
            -url ${{ vars.SW360_URL }} `
            -t ${{ secrets.SW360_TOKEN }} `
            -name "${{ env.PROJECT_NAME }}" `
            -version "${{ env.PROJECT_VERSION }}" `
            -source had-radiologyplus-project-info.json `
            -v
        shell: powershell

      - name: Capture SW360 project ID
        id: get-project-id
        run: |
          Write-Host "=== Capturing SW360 project ID ==="
          $projectId = $null

          # Method 1: Try capycli project find (search by name)
          Write-Host "Method 1: Searching via capycli project find..."
          $output = python -m capycli project find `
            -name "${{ env.PROJECT_NAME }}" `
            -url ${{ vars.SW360_URL }} `
            -t ${{ secrets.SW360_TOKEN }} 2>&1
          $null = $LASTEXITCODE
          $match = ($output | Select-String -Pattern '([a-f0-9]{32})' -AllMatches)
          if ($match -and $match.Matches.Count -gt 0) {
            $projectId = $match.Matches.Groups[1].Value
            Write-Host "Found project ID via search: $projectId"
          }

          # Method 2: Query SW360 API directly
          if (-not $projectId) {
            Write-Host "Method 2: Querying SW360 API directly..."
            try {
              $token = "${{ secrets.SW360_TOKEN }}"
              $url = "${{ vars.SW360_URL }}"
              $searchUrl = "$url/resource/api/search?type=project&searchText=${{ env.PROJECT_NAME }}&pagination=0&elements=10"
              $response = Invoke-RestMethod -Uri $searchUrl -Headers @{
                "X-CSRF-Token" = "$token"
                "Authorization" = "Token $token"
              } -ErrorAction Stop
              if ($response._embedded -and $response._embedded."sw360:projects") {
                foreach ($proj in $response._embedded."sw360:projects") {
                  if ($proj.name -eq "${{ env.PROJECT_NAME }}" -and $proj.version -eq "${{ env.PROJECT_VERSION }}") {
                    $href = $proj._links.self.href
                    $projectId = $href.Split('/')[-1]
                    Write-Host "Found project ID via API: $projectId"
                    break
                  }
                }
              }
            } catch {
              Write-Host "API query failed: $($_.Exception.Message)"
            }
          }

          # Method 3: List all projects
          if (-not $projectId) {
            Write-Host "Method 3: Listing all projects..."
            try {
              $token = "${{ secrets.SW360_TOKEN }}"
              $url = "${{ vars.SW360_URL }}"
              $listUrl = "$url/resource/api/projects?pagination=0&elements=50"
              $response = Invoke-RestMethod -Uri $listUrl -Headers @{
                "X-CSRF-Token" = "$token"
                "Authorization" = "Token $token"
              } -ErrorAction Stop
              if ($response._embedded -and $response._embedded."sw360:projects") {
                foreach ($proj in $response._embedded."sw360:projects") {
                  if ($proj.name -eq "${{ env.PROJECT_NAME }}" -and $proj.version -eq "${{ env.PROJECT_VERSION }}") {
                    $href = $proj._links.self.href
                    $projectId = $href.Split('/')[-1]
                    Write-Host "Found project ID via listing: $projectId"
                    break
                  }
                }
              }
            } catch {
              Write-Host "Project listing failed: $($_.Exception.Message)"
            }
          }

          if ($projectId) {
            Write-Host "SUCCESS: Project ID = $projectId"
            Add-Content -Path $env:GITHUB_OUTPUT -Value "project_id=$projectId"
          } else {
            Write-Host "ERROR: Could not find project ID"
            exit 1
          }
          exit 0
        shell: powershell

      - name: Save project ID to file
        run: |
          $projectId = "${{ steps.get-project-id.outputs.project_id }}"
          $projectId | Out-File -FilePath project-id.txt -Encoding UTF8
        shell: powershell

      - name: Upload project ID
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-id
          path: project-id.txt

      - name: Upload created SBOM for downstream jobs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: created-sbom-forward
          path: created-sbom.json

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 5: Download sources + FOSSology scan
  # ────────────────────────────────────────────────────────────────────────────
  scan-fossology:
    name: "Step 5 · Download sources & Scan"
    runs-on: self-hosted
    needs: create-project

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Download created SBOM
        uses: actions/download-artifact@v4
        with:
          name: created-sbom-forward

      - name: Checkout CapyCLI fork
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/capycli
          ref: feat/sw360/upload_reports
          path: ${{ env.CAPYCLI_DIR }}
          clean: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CapyCLI (force reinstall)
        run: |
          pip uninstall capycli -y
          pip install . --force-reinstall --no-cache-dir
        working-directory: ${{ env.CAPYCLI_DIR }}
        shell: powershell

      # Download sources using the URLs enriched in Step 2.
      # These URLs are now present in the SBOM's externalReferences.
      - name: Download dependency sources
        timeout-minutes: ${{ fromJSON(env.STEP_TIMEOUT_MINUTES) }}
        run: |
          if (-not (Test-Path ${{ env.SOURCE_DIR }})) {
            New-Item -ItemType Directory -Path ${{ env.SOURCE_DIR }} | Out-Null
          }
          python -m capycli bom downloadsources `
            -i created-sbom.json `
            -source ${{ env.SOURCE_DIR }} `
            -o sourced-sbom.json `
            -v
        shell: powershell

      - name: Verify sourced SBOM
        run: |
          if (-not (Test-Path sourced-sbom.json)) {
            Write-Host "ERROR: sourced-sbom.json not found"
            exit 1
          }
          Write-Host "sourced-sbom.json created successfully ($(Get-Item sourced-sbom.json).Length bytes)"
        shell: powershell

      - name: Run FOSSology analysis
        id: fossology
        uses: shatakshisgtiwari-jpg/fossology-action@feat/action/per-dependency-report
        with:
          scan_mode: "scan-only-deps"
          scanners: "ojo copyright"
          report_format: "SPDX_JSON"
          sbom_path: "created-sbom.json"
          per_dependency_report: "true"
          report_dir: ${{ env.REPORT_DIR }}

      - name: Verify FOSSology output
        run: |
          if (-not (Test-Path "results/sbom_spdx.json")) {
            Write-Host "ERROR: results/sbom_spdx.json not found"
            exit 1
          }
          $size = (Get-Item "results/sbom_spdx.json").Length
          Write-Host "OK: results/sbom_spdx.json exists ($size bytes)"
          $reportFiles = Get-ChildItem -Path ${{ env.REPORT_DIR }} -Filter "*.spdx.json" -Recurse -ErrorAction SilentlyContinue
          Write-Host "Per-dependency reports: $($reportFiles.Count)"
          if ($reportFiles.Count -eq 0) {
            Write-Host "WARNING: No per-dependency reports generated - will use consolidated report only"
          }
        shell: powershell

      - name: Upload scan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-artifacts
          path: |
            sourced-sbom.json
            results/
            ${{ env.REPORT_DIR }}/

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 6: Upload sources & reports to SW360
  # ────────────────────────────────────────────────────────────────────────────
  upload-to-sw360:
    name: "Step 6 · Upload to SW360"
    runs-on: self-hosted
    needs: scan-fossology

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Download scan artifacts
        uses: actions/download-artifact@v4
        with:
          name: scan-artifacts
          path: scan-output

      - name: Checkout CapyCLI fork
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/capycli
          ref: feat/sw360/upload_reports
          path: ${{ env.CAPYCLI_DIR }}
          clean: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CapyCLI (force reinstall)
        run: |
          pip uninstall capycli -y
          pip install . --force-reinstall --no-cache-dir
        working-directory: ${{ env.CAPYCLI_DIR }}
        shell: powershell

      - name: Restore files to working directory
        run: |
          Copy-Item "scan-output/sourced-sbom.json" -Destination "sourced-sbom.json" -Force
          if (Test-Path "scan-output/results") {
            Copy-Item "scan-output/results" -Destination "results" -Recurse -Force
          }
          if (Test-Path "scan-output/${{ env.REPORT_DIR }}") {
            Copy-Item "scan-output/${{ env.REPORT_DIR }}" -Destination "${{ env.REPORT_DIR }}" -Recurse -Force
          }
          if (Test-Path "scan-output/sources") {
            Copy-Item "scan-output/sources" -Destination "sources" -Recurse -Force
          }
        shell: powershell

      - name: Attach source files to SW360 releases
        timeout-minutes: ${{ fromJSON(env.STEP_TIMEOUT_MINUTES) }}
        run: |
          python -m capycli bom createreleases `
            -i sourced-sbom.json `
            -o final-sbom.json `
            -url ${{ vars.SW360_URL }} `
            -t ${{ secrets.SW360_TOKEN }} `
            -source ${{ env.SOURCE_DIR }} `
            -v
        shell: powershell

      - name: Verify final SBOM
        run: |
          if (-not (Test-Path final-sbom.json)) {
            Write-Host "ERROR: final-sbom.json not found"
            exit 1
          }
          Write-Host "final-sbom.json created successfully ($(Get-Item final-sbom.json).Length bytes)"
        shell: powershell

      # Upload per-dependency scan reports to SW360
      - name: Upload per-dependency scan reports to SW360
        timeout-minutes: ${{ fromJSON(env.STEP_TIMEOUT_MINUTES) }}
        run: |
          $reportFiles = Get-ChildItem -Path ${{ env.REPORT_DIR }} -Filter "*.spdx.json" -Recurse -ErrorAction SilentlyContinue
          $reportCount = $reportFiles.Count
          Write-Host "Per-dependency reports found: $reportCount"

          if ($reportCount -gt 0) {
            python -m capycli bom uploadreports `
              -i final-sbom.json `
              --report-dir ${{ env.REPORT_DIR }} `
              --filetype COMPONENT_LICENSE_INFO_XML `
              --comment "Fossology SPDX scan - ${{ env.PROJECT_NAME }} ${{ env.PROJECT_VERSION }}" `
              -url ${{ vars.SW360_URL }} `
              -t ${{ secrets.SW360_TOKEN }} `
              -o final-sbom.json `
              -v
          } else {
            Write-Host "WARNING: No per-dependency reports found - skipping per-dependency upload"
          }
        shell: powershell

      # Also upload the consolidated report as a fallback
      - name: Upload consolidated scan report to SW360
        timeout-minutes: ${{ fromJSON(env.STEP_TIMEOUT_MINUTES) }}
        run: |
          if (Test-Path "results/sbom_spdx.json") {
            Write-Host "Uploading consolidated report to all releases..."
            python -m capycli bom uploadreports `
              -i final-sbom.json `
              --report-file results/sbom_spdx.json `
              --filetype COMPONENT_LICENSE_INFO_XML `
              --comment "Consolidated Fossology SPDX scan - ${{ env.PROJECT_NAME }} ${{ env.PROJECT_VERSION }}" `
              -url ${{ vars.SW360_URL }} `
              -t ${{ secrets.SW360_TOKEN }} `
              -o final-sbom.json `
              -v
          } else {
            Write-Host "WARNING: Consolidated report not found - skipping"
          }
        shell: powershell

      - name: Upload final SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-sbom
          path: final-sbom.json

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 7: Validate pipeline completeness
  # ────────────────────────────────────────────────────────────────────────────
  validate-pipeline:
    name: "Step 7 · Validate pipeline"
    runs-on: self-hosted
    needs: upload-to-sw360

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Download final SBOM
        uses: actions/download-artifact@v4
        with:
          name: final-sbom

      - name: Download project ID
        uses: actions/download-artifact@v4
        with:
          name: project-id

      - name: Checkout CapyCLI fork
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/capycli
          ref: feat/sw360/upload_reports
          path: ${{ env.CAPYCLI_DIR }}
          clean: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CapyCLI (force reinstall)
        run: |
          pip uninstall capycli -y
          pip install . --force-reinstall --no-cache-dir
        working-directory: ${{ env.CAPYCLI_DIR }}
        shell: powershell

      - name: Validate pipeline completeness
        run: |
          $projectId = Get-Content -Path project-id.txt -Raw.Trim()
          if (-not $projectId) {
            Write-Host "ERROR: Project ID not available"
            exit 1
          }

          python -m capycli project prerequisites `
            -i final-sbom.json `
            -id $projectId `
            -url ${{ vars.SW360_URL }} `
            -t ${{ secrets.SW360_TOKEN }} `
            --check-reports `
            --forceerror `
            -v
        shell: powershell

      - name: Upload all final artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-sbom-artifacts
          path: |
            final-sbom.json

      - name: Upload FOSSology reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fossology-reports
          path: |
            results/
            ${{ env.REPORT_DIR }}/
          if-no-files-found: warn
