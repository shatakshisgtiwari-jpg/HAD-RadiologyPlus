name: SCA Full Pipeline — had-radiologyplus (Linux)

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'Backend/**'
      - 'FrontEnd/package.json'
      - 'FrontEnd/package-lock.json'
      - 'allowlist.json'
      - '.github/workflows/sca-full-pipeline.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

env:
  PROJECT_NAME: had-radiologyplus
  PROJECT_VERSION: "1.0.0"
  CAPYCLI_DIR: capycli-fork
  REPORT_DIR: per-dependency-reports
  SOURCE_DIR: sources

jobs:
  # ╔══════════════════════════════════════════════════════════════════════════╗
  # ║  STAGE 1 — SBOM Generation & SW360 Sync                                ║
  # ║  Generates SBOM, maps to SW360, creates missing components/releases,   ║
  # ║  and creates/updates the SW360 project.                                ║
  # ╚══════════════════════════════════════════════════════════════════════════╝

  # ────────────────────────────────────────────────────────────────────────────
  # Job 1.1: Generate CycloneDX SBOM with cdxgen
  # ────────────────────────────────────────────────────────────────────────────
  generate-sbom:
    name: " Generate SBOM"
    runs-on: [self-hosted, linux]

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache cdxgen
        id: cache-cdxgen
        uses: actions/cache@v4
        with:
          path: ~/.npm-global/lib/node_modules/@cyclonedx/cdxgen
          key: cdxgen-${{ runner.os }}

      - name: Install cdxgen
        if: steps.cache-cdxgen.outputs.cache-hit != 'true'
        run: npm install -g @cyclonedx/cdxgen

      - name: Generate SBOM
        run: cdxgen -r -o sbom.json --spec-version 1.6 --format json

      - name: Verify and filter SBOM
        run: |
          if [ ! -f sbom.json ]; then
            echo "::error::sbom.json not found!"
            exit 1
          fi
          before=$(jq '.components | length' sbom.json)

          # Remove GitHub Actions components.
          # cdxgen includes actions/checkout, actions/setup-java, etc. as SBOM
          # components. These are CI pipeline tools, not project dependencies.
          # They have no downloadable source archives, which breaks --download.
          # Filter by group="actions" or name matching "actions/*" pattern.
          jq '
            . as $root |
            (.components | map(select(
              (.group // "") != "actions" and
              ((.name // "") | test("^actions/") | not)
            ))) as $filtered |
            ($filtered | map(."bom-ref")) as $keep_refs |
            .components = $filtered |
            if .dependencies then
              .dependencies = [
                .dependencies[] | select(.ref as $r | $keep_refs | index($r) != null)
              ]
            else . end
          ' sbom.json > sbom.json.tmp && mv sbom.json.tmp sbom.json

          after=$(jq '.components | length' sbom.json)
          removed=$(( before - after ))
          echo "SBOM: $after components ($removed GitHub Actions filtered out)"

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
          if-no-files-found: error

  # ────────────────────────────────────────────────────────────────────────────
  # Job 1.2: Map SBOM to SW360 + Create missing components & releases
  # ────────────────────────────────────────────────────────────────────────────
  map-and-create:
    name: " Map & create in SW360"
    runs-on: [self-hosted, linux]
    needs: generate-sbom
    timeout-minutes: 60

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Download SBOM artifact
        uses: actions/download-artifact@v4
        with:
          name: sbom

      - name: Checkout CapyCLI fork
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/capycli
          ref: feat/sw360/upload_reports
          path: ${{ env.CAPYCLI_DIR }}
          clean: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Get capycli commit SHA
        id: capycli-sha
        run: |
          cd ${{ env.CAPYCLI_DIR }}
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache capycli installation
        id: cache-capycli
        uses: actions/cache@v4
        with:
          path: ${{ env.CAPYCLI_DIR }}/.installed
          key: capycli-${{ runner.os }}-py3.11-${{ steps.capycli-sha.outputs.sha }}

      - name: Install CapyCLI
        if: steps.cache-capycli.outputs.cache-hit != 'true'
        run: |
          pip install . --force-reinstall
          mkdir -p ${{ env.CAPYCLI_DIR }}/.installed
          touch ${{ env.CAPYCLI_DIR }}/.installed/marker
        working-directory: ${{ env.CAPYCLI_DIR }}

      - name: Map SBOM to SW360
        run: |
          python -m capycli bom map \
            -i sbom.json \
            -url ${{ vars.SW360_URL }} \
            -t ${{ secrets.SW360_TOKEN }} \
            -mr mapping-result.json \
            -o mapped-sbom.json \
            --matchmode full-search,all-versions \
            -v

      - name: Create missing components and releases
        run: |
          python -m capycli bom createcomponents \
            -i mapped-sbom.json \
            -o created-sbom.json \
            -url ${{ vars.SW360_URL }} \
            -t ${{ secrets.SW360_TOKEN }} \
            -v

      - name: Verify and upload created SBOM
        run: |
          if [ ! -f created-sbom.json ]; then
            echo "ERROR: created-sbom.json not found"
            exit 1
          fi
          size=$(stat -c%s created-sbom.json)
          echo "created-sbom.json: $size bytes"

      - name: Upload mapping results (debug)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mapping-result
          path: mapping-result.json

      - name: Upload created SBOM
        uses: actions/upload-artifact@v4
        with:
          name: created-sbom
          path: created-sbom.json

  # ────────────────────────────────────────────────────────────────────────────
  # Job 1.3: Create/update SW360 project + Capture project ID
  # ────────────────────────────────────────────────────────────────────────────
  create-project:
    name: " Create SW360 project"
    runs-on: [self-hosted, linux]
    needs: map-and-create
    timeout-minutes: 30

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Download created SBOM
        uses: actions/download-artifact@v4
        with:
          name: created-sbom

      - name: Checkout CapyCLI fork
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/capycli
          ref: feat/sw360/upload_reports
          path: ${{ env.CAPYCLI_DIR }}
          clean: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Get capycli commit SHA
        id: capycli-sha
        run: |
          cd ${{ env.CAPYCLI_DIR }}
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache capycli installation
        id: cache-capycli
        uses: actions/cache@v4
        with:
          path: ${{ env.CAPYCLI_DIR }}/.installed
          key: capycli-${{ runner.os }}-py3.11-${{ steps.capycli-sha.outputs.sha }}

      - name: Install CapyCLI
        if: steps.cache-capycli.outputs.cache-hit != 'true'
        run: |
          pip install . --force-reinstall
          mkdir -p ${{ env.CAPYCLI_DIR }}/.installed
          touch ${{ env.CAPYCLI_DIR }}/.installed/marker
        working-directory: ${{ env.CAPYCLI_DIR }}

      - name: Create or update SW360 project
        run: |
          python -m capycli project create \
            -i created-sbom.json \
            -url ${{ vars.SW360_URL }} \
            -t ${{ secrets.SW360_TOKEN }} \
            -name "${{ env.PROJECT_NAME }}" \
            -version "${{ env.PROJECT_VERSION }}" \
            -source had-radiologyplus-project-info.json \
            -v

      - name: Capture SW360 project ID
        id: get-project-id
        run: |
          projectId=$(python -m capycli project find \
            -name "${{ env.PROJECT_NAME }}" \
            -version "${{ env.PROJECT_VERSION }}" \
            -url ${{ vars.SW360_URL }} \
            -t ${{ secrets.SW360_TOKEN }} \
            --id-only)
          echo "project_id=$projectId" >> "$GITHUB_OUTPUT"

      - name: Save project ID to file
        run: |
          echo "${{ steps.get-project-id.outputs.project_id }}" > project-id.txt

      - name: Persist project ID to repo (avoid re-fetch every run)
        run: |
          mkdir -p .sw360
          echo "${{ steps.get-project-id.outputs.project_id }}" > .sw360/project-id.txt
          echo "Persisted project ID to .sw360/project-id.txt"

      - name: Commit persisted project ID
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .sw360/project-id.txt
          if git diff --cached --quiet; then
            echo "No change to project ID - nothing to commit"
          else
            git commit -m "chore(sca): persist SW360 project ID for ${{ env.PROJECT_NAME }} ${{ env.PROJECT_VERSION }}"
            git push
          fi

      - name: Upload project ID
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: project-id
          path: project-id.txt

  # ╔══════════════════════════════════════════════════════════════════════════╗
  # ║  STAGE 2 — Clearing State Filtering & FOSSology Scan                   ║
  # ║  Filters SBOM to only non-cleared releases, downloads sources,         ║
  # ║  and runs FOSSology scanners for license/copyright detection.          ║
  # ╚══════════════════════════════════════════════════════════════════════════╝

  # ────────────────────────────────────────────────────────────────────────────
  # Job 2.1: Filter SBOM by clearing state (skip already-cleared releases)
  # ────────────────────────────────────────────────────────────────────────────
  filter-by-clearing-state:
    name: " Filter by clearing state"
    runs-on: [self-hosted, linux]
    needs: create-project
    timeout-minutes: 30

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Download created SBOM
        uses: actions/download-artifact@v4
        with:
          name: created-sbom

      - name: Checkout CapyCLI fork
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/capycli
          ref: feat/sw360/upload_reports
          path: ${{ env.CAPYCLI_DIR }}
          clean: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Get capycli commit SHA
        id: capycli-sha
        run: |
          cd ${{ env.CAPYCLI_DIR }}
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache capycli installation
        id: cache-capycli
        uses: actions/cache@v4
        with:
          path: ${{ env.CAPYCLI_DIR }}/.installed
          key: capycli-${{ runner.os }}-py3.11-${{ steps.capycli-sha.outputs.sha }}

      - name: Install CapyCLI
        if: steps.cache-capycli.outputs.cache-hit != 'true'
        run: |
          pip install . --force-reinstall
          mkdir -p ${{ env.CAPYCLI_DIR }}/.installed
          touch ${{ env.CAPYCLI_DIR }}/.installed/marker
        working-directory: ${{ env.CAPYCLI_DIR }}

      - name: Filter SBOM by clearing state
        run: |
          python -m capycli bom filter \
            --clearing-state "REPORT_AVAILABLE,APPROVED" \
            -i created-sbom.json \
            -o filtered-sbom.json \
            -url ${{ vars.SW360_URL }} \
            -t ${{ secrets.SW360_TOKEN }} \
            -v

      - name: Verify filtered SBOM
        run: |
          if [ ! -f filtered-sbom.json ]; then
            echo "ERROR: filtered-sbom.json not found"
            exit 1
          fi
          comp_count=$(jq '.components | length' filtered-sbom.json)
          echo "filtered-sbom.json: $comp_count components remaining"

      - name: Upload filtered SBOM
        uses: actions/upload-artifact@v4
        with:
          name: filtered-sbom
          path: filtered-sbom.json

  # ────────────────────────────────────────────────────────────────────────────
  # Job 2.2: Download sources & Run FOSSology scan
  # ────────────────────────────────────────────────────────────────────────────
  scan-fossology:
    name: " Download & FOSSology scan"
    runs-on: [self-hosted, linux]
    needs: filter-by-clearing-state
    timeout-minutes: 120

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Download filtered SBOM
        uses: actions/download-artifact@v4
        with:
          name: filtered-sbom

      - name: Checkout CapyCLI fork
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/capycli
          ref: feat/sw360/upload_reports
          path: ${{ env.CAPYCLI_DIR }}
          clean: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Get capycli commit SHA
        id: capycli-sha
        run: |
          cd ${{ env.CAPYCLI_DIR }}
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache capycli installation
        id: cache-capycli
        uses: actions/cache@v4
        with:
          path: ${{ env.CAPYCLI_DIR }}/.installed
          key: capycli-${{ runner.os }}-py3.11-${{ steps.capycli-sha.outputs.sha }}

      - name: Install CapyCLI
        if: steps.cache-capycli.outputs.cache-hit != 'true'
        run: |
          pip install . --force-reinstall
          mkdir -p ${{ env.CAPYCLI_DIR }}/.installed
          touch ${{ env.CAPYCLI_DIR }}/.installed/marker
        working-directory: ${{ env.CAPYCLI_DIR }}

      - name: Fix Maven source URLs in SBOM
        run: |
          sbom_path="filtered-sbom.json"
          echo "=== Fixing Maven sourceCodeDownloadUrl for Maven Central ==="
          fixed=0

          # Rewrite sourceCodeDownloadUrl for Maven components from VCS URLs to Maven Central source JARs
          jq '
            .components |= map(
              if (.purl // "" | startswith("pkg:maven/")) and .group and .version then
                .sourceCodeDownloadUrl = (
                  "https://repo1.maven.org/maven2/" +
                  (.group | gsub("\\."; "/")) +
                  "/" + .name + "/" + .version + "/" +
                  .name + "-" + .version + "-sources.jar"
                )
              else . end
            )
          ' "$sbom_path" > "${sbom_path}.tmp" && mv "${sbom_path}.tmp" "$sbom_path"

          # Show what URLs were fixed
          jq -r '
            .components[]? |
            select(.purl // "" | startswith("pkg:maven/")) |
            "  \(.name)@\(.version): \(.sourceCodeDownloadUrl // "(none)")"
          ' "$sbom_path"

      - name: Create sourced-sbom.json
        run: |
          cp filtered-sbom.json sourced-sbom.json
          with_ids=$(jq '[.components[] | select(.properties[]?.name == "siemens:sw360Id")] | length' sourced-sbom.json)
          echo "sourced-sbom.json: $with_ids components with sw360Id"

      - name: Verify sourced SBOM
        run: |
          if [ ! -f sourced-sbom.json ]; then
            echo "ERROR: sourced-sbom.json not found"
            exit 1
          fi
          echo "sourced-sbom.json: $(stat -c%s sourced-sbom.json) bytes"

      - name: Pre-create package directories 
        run: |
          mkdir -p pkg_downloads results
          echo "Ensuring package directories exist..."
          jq -r '
            .components[]? |
            [.purl, .name, .version] | @tsv
          ' filtered-sbom.json 2>/dev/null | while IFS=$'\t' read -r purl name version; do
            if [ -n "$purl" ] && [ -n "$name" ] && [ -n "$version" ]; then
              type="${purl#pkg:}"
              type="${type%%/*}"
              mkdir -p "pkg_downloads/${type}/${name}/${version}"
            fi
          done
          echo "Done."

      - name: Run FOSSology analysis (downloads sources + consolidated scan + per-dependency reports)
        uses: shatakshisgtiwari-jpg/fossology-action@feat/action/per-dependency-report
        with:
          scan_mode: "scan-only-deps"
          scanners: "ojo copyright nomos"
          report_format: "SPDX_JSON"
          sbom_path: "filtered-sbom.json"
          per_dependency_report: "true"
          report_dir: "per-dependency-reports"

      - name: Verify FOSSology output
        run: |
          if [ ! -f "results/sbom_spdx.json" ]; then
            echo "ERROR: results/sbom_spdx.json not found"
            exit 1
          fi
          echo "OK: results/sbom_spdx.json ($(stat -c%s results/sbom_spdx.json) bytes)"
          report_files=$(find ${{ env.REPORT_DIR }} -name "*.spdx.json" -type f 2>/dev/null | wc -l)
          echo "Per-dependency reports: $report_files"
          if [ "$report_files" -eq 0 ]; then
            echo "WARNING: No per-dependency reports - will use consolidated report only"
          fi

      - name: Upload scan artifacts
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: scan-artifacts
          path: |
            sourced-sbom.json
            results/
            ${{ env.REPORT_DIR }}/
            ${{ env.SOURCE_DIR }}/

  # ╔══════════════════════════════════════════════════════════════════════════╗
  # ║  STAGE 3 — Upload to SW360 & Validation                                ║
  # ║  Uploads scan reports and source files to SW360 releases, then         ║
  # ║  validates that all prerequisites are met for the project.             ║
  # ╚══════════════════════════════════════════════════════════════════════════╝

  # ────────────────────────────────────────────────────────────────────────────
  # Job 3.1: Upload sources & scan reports to SW360
  # ────────────────────────────────────────────────────────────────────────────
  upload-to-sw360:
    name: " Upload to SW360"
    runs-on: [self-hosted, linux]
    needs: scan-fossology
    timeout-minutes: 120

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Download scan artifacts
        uses: actions/download-artifact@v4
        with:
          name: scan-artifacts
          path: scan-output

      - name: Download filtered SBOM (has all components with sw360Ids)
        uses: actions/download-artifact@v4
        with:
          name: filtered-sbom

      - name: Checkout CapyCLI fork
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/capycli
          ref: feat/sw360/upload_reports
          path: ${{ env.CAPYCLI_DIR }}
          clean: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Get capycli commit SHA
        id: capycli-sha
        run: |
          cd ${{ env.CAPYCLI_DIR }}
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache capycli installation
        id: cache-capycli
        uses: actions/cache@v4
        with:
          path: ${{ env.CAPYCLI_DIR }}/.installed
          key: capycli-${{ runner.os }}-py3.11-${{ steps.capycli-sha.outputs.sha }}

      - name: Install CapyCLI
        if: steps.cache-capycli.outputs.cache-hit != 'true'
        run: |
          pip install . --force-reinstall
          mkdir -p ${{ env.CAPYCLI_DIR }}/.installed
          touch ${{ env.CAPYCLI_DIR }}/.installed/marker
        working-directory: ${{ env.CAPYCLI_DIR }}

      - name: Restore files to working directory
        run: |
          if [ -f "scan-output/sourced-sbom.json" ]; then
            cp "scan-output/sourced-sbom.json" "sourced-sbom.json"
            echo "Restored sourced-sbom.json"
          else
            echo "WARNING: sourced-sbom.json not found in scan-output"
          fi
          [ -d "scan-output/results" ] && cp -r "scan-output/results" . && echo "Restored results" || true
          [ -d "scan-output/${{ env.REPORT_DIR }}" ] && cp -r "scan-output/${{ env.REPORT_DIR }}" . && echo "Restored ${{ env.REPORT_DIR }}" || true
          [ -d "scan-output/sources" ] && cp -r "scan-output/sources" . && echo "Restored sources" || true

      - name: Attach source files to SW360 releases
        run: |
          # Use filtered-sbom.json (has ALL components with sw360Ids) as input.
          # sourced-sbom.json only has components with downloadable source URLs,
          # which is a subset — using it would lose components.
          python -m capycli bom createreleases \
            -i filtered-sbom.json \
            -o final-sbom.json \
            -url ${{ vars.SW360_URL }} \
            -t ${{ secrets.SW360_TOKEN }} \
            -source ${{ env.SOURCE_DIR }} \
            -v

      - name: Restore sw360Ids in final SBOM
        run: |
          echo "=== Restoring sw360Ids in final-sbom.json ==="
          id_map=$(jq '[.components[] | {key: "\(.name)@\(.version)", value: (.properties[]? | select(.name == "siemens:sw360Id") | .value)}] | from_entries' "filtered-sbom.json")
          id_count=$(echo "$id_map" | jq 'length')
          echo "Found $id_count sw360Ids in filtered-sbom.json"

          jq --argjson id_map "$id_map" '
            .components |= map(
              .key = "\(.name)@\(.version)" |
              if $id_map[.key] and (.properties | any(.name == "siemens:sw360Id") | not) then
                .properties += [{"name": "siemens:sw360Id", "value": $id_map[.key]}]
              else . end |
              del(.key)
            )
          ' "final-sbom.json" > "final-sbom.json.tmp" && mv "final-sbom.json.tmp" "final-sbom.json"

          with_ids=$(jq '[.components[] | select(.properties[]?.name == "siemens:sw360Id")] | length' "final-sbom.json")
          echo "final-sbom.json: $with_ids components with sw360Id"

      - name: Verify final SBOM
        run: |
          if [ ! -f final-sbom.json ]; then
            echo "ERROR: final-sbom.json not found"
            exit 1
          fi
          size=$(stat -c%s final-sbom.json)
          with_ids=$(jq '[.components[] | select(.properties[]?.name == "siemens:sw360Id")] | length' final-sbom.json)
          echo "final-sbom.json: $size bytes, $with_ids components with sw360Id"

      - name: Upload per-dependency scan reports to SW360
        run: |
          report_files=$(find ${{ env.REPORT_DIR }} -name "*.spdx.json" -type f 2>/dev/null)
          report_count=$(echo "$report_files" | wc -l)
          echo "Per-dependency reports found: $report_count"

          if [ "$report_count" -gt 0 ]; then
            max_retries=3
            retry_delay=30
            last_exit=0

            for attempt in $(seq 1 $max_retries); do
              echo "=== Upload attempt $attempt of $max_retries ==="
              python -m capycli bom uploadreports \
                -i final-sbom.json \
                --report-dir ${{ env.REPORT_DIR }} \
                --filetype COMPONENT_LICENSE_INFO_XML \
                --comment "Fossology SPDX scan - ${{ env.PROJECT_NAME }} ${{ env.PROJECT_VERSION }}" \
                -url ${{ vars.SW360_URL }} \
                -t ${{ secrets.SW360_TOKEN }} \
                -o final-sbom.json \
                -v
              last_exit=$?

              if [ "$last_exit" -eq 0 ]; then
                echo "Upload completed successfully on attempt $attempt"
                break
              else
                echo "Upload failed (exit code $last_exit) on attempt $attempt"
                if [ "$attempt" -lt "$max_retries" ]; then
                  echo "Retrying in $retry_delay seconds..."
                  sleep "$retry_delay"
                fi
              fi
            done

            if [ "$last_exit" -ne 0 ]; then
              echo "::warning::Per-dependency upload failed after $max_retries attempts"
            fi
          else
            echo "WARNING: No per-dependency reports found - skipping"
          fi

      - name: Upload consolidated scan report to SW360 (fallback only)
        run: |
          # The consolidated report is only uploaded as a fallback when there
          # are no per-dependency reports. If per-dependency reports exist,
          # they are the authoritative per-release scan data and the
          # consolidated report would be redundant.
          report_files=$(find ${{ env.REPORT_DIR }} -name "*.spdx.json" -type f 2>/dev/null)
          report_count=$(echo "$report_files" | wc -l)

          if [ "$report_count" -gt 0 ]; then
            echo "Per-dependency reports present ($report_count) - skipping consolidated upload"
          elif [ -f "results/sbom_spdx.json" ]; then
            echo "No per-dependency reports - uploading consolidated report as fallback..."
            max_retries=3
            retry_delay=30
            last_exit=0

            for attempt in $(seq 1 $max_retries); do
              echo "=== Consolidated upload attempt $attempt of $max_retries ==="
              python -m capycli bom uploadreports \
                -i final-sbom.json \
                --report-file results/sbom_spdx.json \
                --filetype COMPONENT_LICENSE_INFO_XML \
                --comment "Consolidated Fossology SPDX scan - ${{ env.PROJECT_NAME }} ${{ env.PROJECT_VERSION }}" \
                -url ${{ vars.SW360_URL }} \
                -t ${{ secrets.SW360_TOKEN }} \
                -o final-sbom.json \
                -v
              last_exit=$?

              if [ "$last_exit" -eq 0 ]; then
                echo "Consolidated upload completed on attempt $attempt"
                break
              else
                echo "Consolidated upload failed (exit code $last_exit) on attempt $attempt"
                if [ "$attempt" -lt "$max_retries" ]; then
                  echo "Retrying in $retry_delay seconds..."
                  sleep "$retry_delay"
                fi
              fi
            done

            if [ "$last_exit" -ne 0 ]; then
              echo "::warning::Consolidated upload failed after $max_retries attempts"
            fi
          else
            echo "WARNING: Consolidated report not found - skipping"
          fi

      - name: Upload final SBOM
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: final-sbom
          path: final-sbom.json

  # ────────────────────────────────────────────────────────────────────────────
  # Job 3.2: Validate pipeline completeness
  # ────────────────────────────────────────────────────────────────────────────
  validate-pipeline:
    name: " Validate pipeline"
    runs-on: [self-hosted, linux]
    needs: upload-to-sw360
    timeout-minutes: 30

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Download final SBOM
        uses: actions/download-artifact@v4
        with:
          name: final-sbom

      - name: Download project ID
        uses: actions/download-artifact@v4
        with:
          name: project-id

      - name: Checkout CapyCLI fork
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/capycli
          ref: feat/sw360/upload_reports
          path: ${{ env.CAPYCLI_DIR }}
          clean: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Get capycli commit SHA
        id: capycli-sha
        run: |
          cd ${{ env.CAPYCLI_DIR }}
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache capycli installation
        id: cache-capycli
        uses: actions/cache@v4
        with:
          path: ${{ env.CAPYCLI_DIR }}/.installed
          key: capycli-${{ runner.os }}-py3.11-${{ steps.capycli-sha.outputs.sha }}

      - name: Install CapyCLI
        if: steps.cache-capycli.outputs.cache-hit != 'true'
        run: |
          pip install . --force-reinstall
          mkdir -p ${{ env.CAPYCLI_DIR }}/.installed
          touch ${{ env.CAPYCLI_DIR }}/.installed/marker
        working-directory: ${{ env.CAPYCLI_DIR }}

      - name: Validate pipeline completeness
        run: |
          project_id=$(cat project-id.txt | tr -d '[:space:]')
          if [ -z "$project_id" ]; then
            echo "ERROR: Project ID not available"
            exit 1
          fi

          python -m capycli project prerequisites \
            -i final-sbom.json \
            -id "$project_id" \
            -url ${{ vars.SW360_URL }} \
            -t ${{ secrets.SW360_TOKEN }} \
            --check-reports \
            --forceerror \
            -v

      # Note: all-sbom-artifacts and fossology-reports are intentionally omitted.
      # final-sbom.json is already uploaded by upload-to-sw360 job.
      # results/ and per-dependency-reports/ are already in scan-artifacts.
      # Uploading them again here would create redundant artifacts.
