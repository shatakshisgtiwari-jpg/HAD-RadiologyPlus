name: SCA Full Pipeline — had-radiologyplus (Linux)

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'Backend/**'
      - 'FrontEnd/package.json'
      - 'FrontEnd/package-lock.json'
      - 'allowlist.json'
      - '.github/workflows/sca-full-pipeline.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT_NAME: had-radiologyplus
  PROJECT_VERSION: "1.0.0"
  CAPYCLI_DIR: capycli-fork
  REPORT_DIR: per-dependency-reports
  SOURCE_DIR: sources

jobs:
  # ╔══════════════════════════════════════════════════════════════════════════╗
  # ║  STAGE 1 — SBOM Generation & SW360 bootstrap                              ║
  # ║  Generates the SBOM, maps it to SW360, bootstraps missing components and  ║
  # ║  prerequisite releases, and creates/updates the SW360 project.            ║
  # ╚══════════════════════════════════════════════════════════════════════════╝

  # ────────────────────────────────────────────────────────────────────────────
  # Job 1.1: Generate CycloneDX SBOM with cdxgen
  # ────────────────────────────────────────────────────────────────────────────
  generate-sbom:
    name: " Generate SBOM"
    runs-on: [self-hosted, linux]

    steps:
      - name: Remove stale scanner artifacts
        run: |
          set -euo pipefail
          for path in pkg_downloads results "${{ env.REPORT_DIR }}" "${{ env.SOURCE_DIR }}" source_archives; do
            if [ -e "$GITHUB_WORKSPACE/$path" ]; then
              docker run --rm --user 0:0 \
                --entrypoint /bin/sh \
                -v "$GITHUB_WORKSPACE:/workspace" \
                fossology/fossology:scanner \
                -c 'rm -rf -- "/workspace/$1"' sh "$path"
            fi
          done

      - name: Checkout project
        uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache cdxgen
        id: cache-cdxgen
        uses: actions/cache@v4
        with:
          path: ~/.npm-global/lib/node_modules/@cyclonedx/cdxgen
          key: cdxgen-${{ runner.os }}

      - name: Install cdxgen
        if: steps.cache-cdxgen.outputs.cache-hit != 'true'
        run: npm install -g @cyclonedx/cdxgen

      - name: Generate SBOM
        run: cdxgen -r -o sbom.json --spec-version 1.7 --format json

      - name: Verify and filter SBOM
        run: |
          if [ ! -f sbom.json ]; then
            echo "::error::sbom.json not found!"
            exit 1
          fi
          spec_version=$(jq -r '.specVersion // empty' sbom.json)
          if [ "$spec_version" != "1.7" ]; then
            echo "::error::Expected CycloneDX specVersion 1.7, found '$spec_version'"
            exit 1
          fi
          echo "CycloneDX specVersion: $spec_version"
          before=$(jq '.components | length' sbom.json)

          # Remove GitHub Actions components.
          # cdxgen includes actions/checkout, actions/setup-java, etc. as SBOM
          # components. These are CI pipeline tools, not project dependencies.
          # They have no source archives, so they cannot enter the scan flow.
          # Filter action packages by their legacy names and GitHub purls.
          jq '
            . as $root |
            (.components | map(select(
              (.group // "") != "actions" and
              ((.name // "") | test("^actions/") | not) and
              ((.purl // "") | startswith("pkg:github/") | not)
            ))) as $filtered |
            ($filtered | map(."bom-ref")) as $keep_refs |
            .components = $filtered |
            if .dependencies then
              .dependencies = [
                .dependencies[] | select(.ref as $r | $keep_refs | index($r) != null)
              ]
            else . end
          ' sbom.json > sbom.json.tmp && mv sbom.json.tmp sbom.json

          after=$(jq '.components | length' sbom.json)
          removed=$(( before - after ))
          echo "SBOM: $after components ($removed GitHub Actions filtered out)"

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
          if-no-files-found: error
          retention-days: 7

  # ────────────────────────────────────────────────────────────────────────────
  # Job 1.2: Map SBOM to SW360 + Bootstrap missing components & releases
  # ────────────────────────────────────────────────────────────────────────────
  map-and-create:
    name: " Map & create in SW360"
    runs-on: [self-hosted, linux]
    needs: generate-sbom
    timeout-minutes: 60

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Download SBOM artifact
        uses: actions/download-artifact@v4
        with:
          name: sbom

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Normalize source archive references
        run: |
          python3 - <<'PY'
          import json
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          SBOM_PATH = Path("sbom.json")
          SOURCE_COMMENT = "source archive (download location)"
          SUPPORTED_TYPES = {"pypi", "npm", "composer", "maven"}

          def purl_parts(purl):
            if not isinstance(purl, str) or not purl.startswith("pkg:"):
              return None, None, None
            body = purl[4:].split("#", 1)[0].split("?", 1)[0]
            try:
              package_type, remainder = body.split("/", 1)
              name_part, version = remainder.rsplit("@", 1)
            except ValueError:
              return None, None, None
            return (
              package_type,
              urllib.parse.unquote(name_part),
              urllib.parse.unquote(version),
            )

          def http_json(url):
            request = urllib.request.Request(
              url,
              headers={"User-Agent": "had-radiologyplus-sca/1.0"},
            )
            with urllib.request.urlopen(request, timeout=20) as response:
              return json.load(response)

          def registry_archive_url(component):
            package_type, purl_name, purl_version = purl_parts(component.get("purl"))
            name = component.get("name") or purl_name
            version = component.get("version") or purl_version
            if not package_type or not name or not version:
              return None

            if package_type == "npm":
              package_path = urllib.parse.quote(name, safe="@/")
              archive_name = name.rsplit("/", 1)[-1]
              return (
                f"https://registry.npmjs.org/{package_path}/-/"
                f"{archive_name}-{urllib.parse.quote(version, safe='')}.tgz"
              )

            if package_type == "maven":
              namespace = component.get("group") or ""
              if not namespace and purl_name and "/" in purl_name:
                namespace, name = purl_name.rsplit("/", 1)
              if not namespace:
                return None
              group_path = namespace.replace(".", "/")
              return (
                f"https://repo1.maven.org/maven2/{group_path}/{name}/"
                f"{version}/{name}-{version}-sources.jar"
              )

            if package_type == "pypi":
              metadata = http_json(
                f"https://pypi.org/pypi/{urllib.parse.quote(name)}/"
                f"{urllib.parse.quote(version)}/json"
              )
              files = metadata.get("urls", [])
              source_files = [item for item in files if item.get("packagetype") == "sdist"]
              wheel_files = [item for item in files if item.get("packagetype") == "bdist_wheel"]
              selected = source_files or wheel_files
              return selected[0].get("url") if selected else None

            if package_type == "composer":
              if "/" not in name:
                return None
              metadata = http_json(
                "https://repo.packagist.org/p2/"
                f"{urllib.parse.quote(name, safe='/')}.json"
              )
              releases = metadata.get("packages", {}).get(name, [])
              for release in releases:
                if release.get("version") == version:
                  return (release.get("dist") or {}).get("url")
              return None

            return None

          def is_archive_download_url(url):
            if not isinstance(url, str) or not url.startswith(("http://", "https://")):
              return False
            path = urllib.parse.urlparse(url).path.lower()
            return not (
              # Repository pages and Git endpoints are not source archives and
              # SW360 rejects them as sourceCodeDownloadUrl values.
              path.endswith(".git")
              or "/blob/" in path
              or "/tree/" in path
              or "/-/blob/" in path
              or "/-/tree/" in path
            )

          def existing_archive_url(component):
            for reference in component.get("externalReferences") or []:
              url = reference.get("url")
              if not is_archive_download_url(url):
                continue
              if reference.get("type") == "source-distribution":
                return url
              if (
                reference.get("type") == "distribution"
                and reference.get("comment") == SOURCE_COMMENT
              ):
                return url

            for prop in component.get("properties") or []:
              if prop.get("name") in {"ResolvedUrl", "resolvedUrl"}:
                url = prop.get("value")
                if is_archive_download_url(url):
                  return url
            return None

          with SBOM_PATH.open(encoding="utf-8") as stream:
            sbom = json.load(stream)

          failures = []
          for component in sbom.get("components", []):
            package_type, _, _ = purl_parts(component.get("purl"))
            if package_type not in SUPPORTED_TYPES:
              failures.append(
                f"{component.get('purl', '<missing purl>')} "
                f"uses unsupported ecosystem '{package_type or 'unknown'}'"
              )
              continue

            source_url = existing_archive_url(component)
            if not source_url:
              try:
                source_url = registry_archive_url(component)
              except (OSError, urllib.error.URLError, json.JSONDecodeError) as error:
                failures.append(
                  f"{component.get('purl', '<missing purl>')} "
                  f"({package_type or 'unknown'} registry lookup: {error})"
                )
                continue

            if not source_url:
              failures.append(
                "has no source-distribution URL or resolvable archive metadata"
              )
              continue

            references = [
              reference
              for reference in component.get("externalReferences") or []
              if not (
                reference.get("type") == "source-distribution"
                or (
                  reference.get("type") == "distribution"
                  and reference.get("comment") == SOURCE_COMMENT
                )
              )
            ]
            references.append({
              "type": "distribution",
              "comment": SOURCE_COMMENT,
              "url": source_url,
            })
            component["externalReferences"] = references

          if failures:
            print("Unable to resolve source archives:")
            print("\n".join(f"  - {failure}" for failure in failures))
            raise SystemExit("Every SBOM component must have a resolvable source archive")

          with SBOM_PATH.open("w", encoding="utf-8") as stream:
            json.dump(sbom, stream, indent=2)
            stream.write("\n")
          print(f"Normalized source archive references for {len(sbom.get('components', []))} components")
          PY

      - name: Checkout CapyCLI fork
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/capycli
          ref: feat/sw360/upload_reports
          path: ${{ env.CAPYCLI_DIR }}
          clean: true

      - name: Get capycli commit SHA
        id: capycli-sha
        run: |
          cd ${{ env.CAPYCLI_DIR }}
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache capycli installation
        id: cache-capycli
        uses: actions/cache@v4
        with:
          path: ${{ env.CAPYCLI_DIR }}/.installed
          key: capycli-${{ runner.os }}-py3.11-${{ steps.capycli-sha.outputs.sha }}

      - name: Install CapyCLI
        if: steps.cache-capycli.outputs.cache-hit != 'true'
        run: |
          pip install . --force-reinstall
          mkdir -p ${{ env.CAPYCLI_DIR }}/.installed
          touch ${{ env.CAPYCLI_DIR }}/.installed/marker
        working-directory: ${{ env.CAPYCLI_DIR }}

      - name: Map SBOM to SW360
        run: |
          set +e
          python -m capycli bom map \
            -i sbom.json \
            -url ${{ vars.SW360_URL }} \
            -t ${{ secrets.SW360_TOKEN }} \
            -mr mapping-result.json \
            -o mapped-sbom.json \
            --matchmode full-search,all-versions \
            -v
          rc=$?
          set -e
          # 80 = RESULT_NO_UNIQUE_MAPPING, 81 = RESULT_INCOMPLETE_MAPPING.
          # Both are expected on first run before SW360 has the components;
          # the createcomponents step below creates them. Fail on any other error.
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 80 ] && [ "$rc" -ne 81 ]; then
            exit "$rc"
          fi
          echo "Incomplete mapping is acceptable on first run - continuing to create components/releases."

      - name: Reject ambiguous SW360 mappings
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          mapping_path = Path("mapping-result.json")
          if not mapping_path.is_file():
              raise SystemExit("Mapping result was not produced")

          with mapping_path.open(encoding="utf-8") as stream:
              mappings = json.load(stream)

          unsafe_matches = []
          for mapping in mappings:
              matches = mapping.get("Matches") or []
              release_ids = {
                  match.get("Sw360Id") or match.get("Id")
                  for match in matches
                  if match.get("Sw360Id") or match.get("Id")
              }
              item = mapping.get("BomItem") or {}
              name = item.get("name") or item.get("Name") or "unknown"
              version = item.get("version") or item.get("Version") or "unknown"
              requested_purl = item.get("purl") or item.get("Purl")
              if len(release_ids) > 1:
                  unsafe_matches.append(
                      f"{name}@{version}: multiple candidate release IDs: "
                      f"{', '.join(sorted(release_ids))}"
                  )
                  continue

              # CapyCLI maps names and versions case-insensitively. A good
              # match must still be the exact SBOM identity before it can be
              # reused; name-only candidates are intentionally left for
              # createcomponents to create the requested release.
              if mapping.get("Result", "") > "4-good-match-by-filename":
                  continue
              for match in matches:
                  match_name = match.get("Name") or match.get("name")
                  match_version = match.get("Version") or match.get("version")
                  match_purls = [
                      match.get("RepositoryId"),
                      (match.get("ExternalIds") or {}).get("package-url"),
                      (match.get("ExternalIds") or {}).get("purl"),
                  ]
                  match_purls = [value for value in match_purls if value]
                  if (
                      match_name != name
                      or match_version != version
                      or (requested_purl and match_purls and requested_purl not in match_purls)
                  ):
                      unsafe_matches.append(
                          f"{name}@{version}: candidate "
                          f"{match_name}@{match_version} has a different exact identity"
                      )

          if unsafe_matches:
              raise SystemExit(
                  "Unsafe SW360 release mappings must be resolved before creation:\n  - "
                  + "\n  - ".join(unsafe_matches)
              )
          print("SW360 mapping contains only exact reusable releases or createable candidates")
          PY

      - name: Bootstrap missing components and prerequisite releases
        run: |
          # This creates the SW360 release IDs needed by the clearing-state
          # filter. The final release creation/attachment runs after FOSSology.
          python -m capycli bom createcomponents \
            -i mapped-sbom.json \
            -o created-sbom.json \
            -url ${{ vars.SW360_URL }} \
            -t ${{ secrets.SW360_TOKEN }} \
            -X \
            -v

      - name: Verify and upload created SBOM
        run: |
          if [ ! -f created-sbom.json ]; then
            echo "ERROR: created-sbom.json not found"
            exit 1
          fi
          size=$(stat -c%s created-sbom.json)
          total=$(jq '.components | length' created-sbom.json)
          with_ids=$(jq '[.components[] | select(.properties[]?.name == "siemens:sw360Id")] | length' created-sbom.json)
          with_names=$(jq '[.components[] | select(.name != null and .name != "")] | length' created-sbom.json)
          with_versions=$(jq '[.components[] | select(.version != null and .version != "")] | length' created-sbom.json)
          with_ext_refs=$(jq '[.components[] | select((.externalReferences // []) | length > 0)] | length' created-sbom.json)
          echo "created-sbom.json: $size bytes, $total components"
          echo "  sw360Id:            $with_ids/$total"
          echo "  name:               $with_names/$total"
          echo "  version:            $with_versions/$total"
          echo "  externalReferences: $with_ext_refs/$total"
          if [ "$total" -eq 0 ] || [ "$with_ids" -ne "$total" ]; then
            echo "ERROR: Not every SBOM component has a SW360 release ID"
            exit 1
          fi
          if [ "$with_names" -ne "$total" ]; then
            echo "ERROR: CapyCLI dropped component names during round-trip (CycloneDX 1.7 may not be supported by cyclonedx-python-lib)"
            echo "Dumping first component for inspection:"
            jq '.components[0]' created-sbom.json
            exit 1
          fi

      - name: Upload mapping results (debug)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mapping-result
          path: mapping-result.json
          retention-days: 7

      - name: Upload created SBOM
        uses: actions/upload-artifact@v4
        with:
          name: created-sbom
          path: created-sbom.json
          if-no-files-found: error
          retention-days: 7

  # ────────────────────────────────────────────────────────────────────────────
  # Job 1.3: Create/update SW360 project + Capture project ID
  # ────────────────────────────────────────────────────────────────────────────
  create-project:
    name: " Create SW360 project"
    runs-on: [self-hosted, linux]
    needs: map-and-create
    timeout-minutes: 30

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Download created SBOM
        uses: actions/download-artifact@v4
        with:
          name: created-sbom

      - name: Checkout CapyCLI fork
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/capycli
          ref: feat/sw360/upload_reports
          path: ${{ env.CAPYCLI_DIR }}
          clean: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Get capycli commit SHA
        id: capycli-sha
        run: |
          cd ${{ env.CAPYCLI_DIR }}
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache capycli installation
        id: cache-capycli
        uses: actions/cache@v4
        with:
          path: ${{ env.CAPYCLI_DIR }}/.installed
          key: capycli-${{ runner.os }}-py3.11-${{ steps.capycli-sha.outputs.sha }}

      - name: Install CapyCLI
        if: steps.cache-capycli.outputs.cache-hit != 'true'
        run: |
          pip install . --force-reinstall
          mkdir -p ${{ env.CAPYCLI_DIR }}/.installed
          touch ${{ env.CAPYCLI_DIR }}/.installed/marker
        working-directory: ${{ env.CAPYCLI_DIR }}

      - name: Create or update SW360 project
        run: |
          python -m capycli project create \
            -i created-sbom.json \
            -url ${{ vars.SW360_URL }} \
            -t ${{ secrets.SW360_TOKEN }} \
            -name "${{ env.PROJECT_NAME }}" \
            -version "${{ env.PROJECT_VERSION }}" \
            -source had-radiologyplus-project-info.json \
            -v

      - name: Cache SW360 project ID
        id: cache-project-id
        uses: actions/cache@v4
        with:
          path: .sw360/project-id.txt
          key: sw360-project-id-${{ env.PROJECT_NAME }}-${{ env.PROJECT_VERSION }}

      - name: Capture SW360 project ID (use cache if available)
        id: get-project-id
        run: |
          if [ -f .sw360/project-id.txt ]; then
            projectId=$(cat .sw360/project-id.txt | tr -d '[:space:]')
            echo "Using cached project ID: $projectId"
          else
            projectId=$(python -m capycli project find \
              -name "${{ env.PROJECT_NAME }}" \
              -version "${{ env.PROJECT_VERSION }}" \
              -url ${{ vars.SW360_URL }} \
              -t ${{ secrets.SW360_TOKEN }} \
              --id-only)
            echo "Fetched project ID: $projectId"
          fi
          echo "project_id=$projectId" >> "$GITHUB_OUTPUT"

      - name: Save project ID to file
        run: |
          echo "${{ steps.get-project-id.outputs.project_id }}" > project-id.txt
          mkdir -p .sw360
          echo "${{ steps.get-project-id.outputs.project_id }}" > .sw360/project-id.txt

      - name: Upload project ID
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: project-id
          path: project-id.txt
          if-no-files-found: error
          retention-days: 7

  # ╔══════════════════════════════════════════════════════════════════════════╗
  # ║  STAGE 2 — Clearing State Filtering & FOSSology Scan                   ║
  # ║  Filters SBOM to only non-cleared releases, downloads sources,         ║
  # ║  and runs FOSSology scanners for license/copyright detection.          ║
  # ╚══════════════════════════════════════════════════════════════════════════╝

  # ────────────────────────────────────────────────────────────────────────────
  # Job 2.1: Filter SBOM by clearing state (skip already-cleared releases)
  # ────────────────────────────────────────────────────────────────────────────
  filter-by-clearing-state:
    name: " Filter by clearing state"
    runs-on: [self-hosted, linux]
    needs: create-project
    timeout-minutes: 30

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Download created SBOM
        uses: actions/download-artifact@v4
        with:
          name: created-sbom

      - name: Filter SBOM by clearing state
        run: |
          sw360_url="${{ vars.SW360_URL }}"
          token="${{ secrets.SW360_TOKEN }}"
          sbom_path="created-sbom.json"

          total=$(jq '.components | length' "$sbom_path")
          echo "=== Filtering $total components by clearing state ==="

          # Use temp files instead of shell variables to avoid "Argument list too long"
          included_file=$(mktemp)
          skipped_file=$(mktemp)
          errors_file=$(mktemp)
          echo '[]' > "$included_file"
          echo '[]' > "$skipped_file"
          echo '[]' > "$errors_file"

          add_clearing_state() {
            jq --arg state "$2" '
              .properties = ((.properties // [])
                | map(select(.name != "siemens:clearingState"))
                + [{"name": "siemens:clearingState", "value": $state}])
            ' <<< "$1"
          }

          comp_count=$(jq '.components | length' "$sbom_path")

          for i in $(seq 0 $((comp_count - 1))); do
            comp=$(jq ".components[$i]" "$sbom_path")
            name=$(echo "$comp" | jq -r '.name')
            version=$(echo "$comp" | jq -r '.version // "unknown"')
            sw360_id=$(echo "$comp" | jq -r '.properties[]? | select(.name == "siemens:sw360Id") | .value' 2>/dev/null)

            if [ -z "$sw360_id" ] || [ "$sw360_id" = "null" ]; then
              comp=$(add_clearing_state "$comp" "NO_SW360_ID")
              jq --argjson component "$comp" '. + [$component]' "$included_file" > "${included_file}.tmp" && mv "${included_file}.tmp" "$included_file"
              echo "  [INCLUDE] $name@$version (no SW360 ID)"
              continue
            fi

            release_url="$sw360_url/resource/api/releases/$sw360_id"
            response=$(curl -s -H "Authorization: Token $token" "$release_url" 2>/dev/null) || true

            if [ -z "$response" ]; then
              comp=$(add_clearing_state "$comp" "QUERY_ERROR")
              jq --argjson component "$comp" '. + [$component]' "$included_file" > "${included_file}.tmp" && mv "${included_file}.tmp" "$included_file"
              jq --argjson component "$comp" '. + [$component]' "$errors_file" > "${errors_file}.tmp" && mv "${errors_file}.tmp" "$errors_file"
              echo "  [INCLUDE] $name@$version - query error"
              continue
            fi

            clearing_state=$(echo "$response" | jq -r '.clearingState // empty')

            if [ -z "$clearing_state" ]; then
              comp=$(add_clearing_state "$comp" "UNKNOWN")
              jq --argjson component "$comp" '. + [$component]' "$included_file" > "${included_file}.tmp" && mv "${included_file}.tmp" "$included_file"
              echo "  [INCLUDE] $name@$version (no clearing state)"
            elif [ "$clearing_state" = "REPORT_AVAILABLE" ] || [ "$clearing_state" = "APPROVED" ]; then
              comp=$(add_clearing_state "$comp" "$clearing_state")
              jq --argjson component "$comp" '. + [$component]' "$skipped_file" > "${skipped_file}.tmp" && mv "${skipped_file}.tmp" "$skipped_file"
              echo "  [SKIP]    $name@$version - clearingState=$clearing_state"
            else
              comp=$(add_clearing_state "$comp" "$clearing_state")
              jq --argjson component "$comp" '. + [$component]' "$included_file" > "${included_file}.tmp" && mv "${included_file}.tmp" "$included_file"
              echo "  [INCLUDE] $name@$version - clearingState=$clearing_state"
            fi
          done

          # Preserve every component, enriching both included and skipped entries.
          enriched_path="enriched-sbom.json"
          jq --slurpfile included "$included_file" --slurpfile skipped "$skipped_file" '
            ($included[0] + $skipped[0]) as $classified |
            .components = [
              .components[] as $original |
              (($classified | map(select(."bom-ref" == $original."bom-ref")) | first) // $original)
            ]
          ' "$sbom_path" > "$enriched_path"

          # Build the scan-only SBOM from the enriched all-components SBOM.
          jq '[.[]."bom-ref"]' "$included_file" > "${included_file}.refs"

          jq --slurpfile included_refs "${included_file}.refs" '
            .components = [
              .components[] |
              select(."bom-ref" as $ref | $included_refs[0] | index($ref) != null)
            ] |
            if .dependencies then
              .dependencies = [
                .dependencies[] | select(.ref as $r | $included_refs[0] | index($r) != null) |
                if .dependsOn then
                  .dependsOn = [.dependsOn[] | select(. as $c | $included_refs[0] | index($c) != null)]
                else . end |
                select((.dependsOn | length) > 0 or (.dependsOn == null))
              ]
            else . end
          ' "$enriched_path" > "filtered-sbom.json"

          included_count=$(jq 'length' "$included_file")
          skipped_count=$(jq 'length' "$skipped_file")
          errors_count=$(jq 'length' "$errors_file")

          rm -f "$included_file" "$skipped_file" "$errors_file" "${included_file}.refs"

          echo ""
          echo "=== Filtering Summary ==="
          echo "Total components:     $total"
          echo "Included (need scan): $included_count"
          echo "Skipped (already cleared): $skipped_count"
          echo "Query errors:         $errors_count"
          echo "Enriched SBOM:        $enriched_path"
          echo "Filtered SBOM:        filtered-sbom.json"
          if [ "$errors_count" -ne 0 ]; then
            echo "ERROR: SW360 release queries failed; refusing to scan with unknown clearing state"
            exit 1
          fi

      - name: Verify filtered SBOM
        run: |
          if [ ! -f enriched-sbom.json ] || [ ! -f filtered-sbom.json ]; then
            echo "ERROR: enriched-sbom.json or filtered-sbom.json not found"
            exit 1
          fi
          all_count=$(jq '.components | length' enriched-sbom.json)
          filtered_count=$(jq '.components | length' filtered-sbom.json)
          state_count=$(jq '[.components[] | select(.properties[]?.name == "siemens:clearingState")] | length' enriched-sbom.json)
          invalid_filtered=$(jq '[.components[] | select(
            if type != "object" then true
            else
              ((."bom-ref" // "") == "") or
              ((.name // "") == "") or
              ((.version // "") == "")
            end
          )] | length' filtered-sbom.json)
          duplicate_filtered=$(jq '[.components[]."bom-ref"] | group_by(.) | map(select(length > 1)) | length' filtered-sbom.json)
          echo "enriched-sbom.json: $all_count components, $state_count with clearing state"
          echo "filtered-sbom.json: $filtered_count components to scan"
          if [ "$all_count" -eq 0 ] || [ "$state_count" -ne "$all_count" ]; then
            echo "ERROR: Enriched SBOM is missing clearing state values"
            exit 1
          fi
          if [ "$invalid_filtered" -ne 0 ] || [ "$duplicate_filtered" -ne 0 ]; then
            echo "ERROR: filtered-sbom.json is not a flat SBOM component list (invalid=$invalid_filtered, duplicate_bom_refs=$duplicate_filtered)"
            exit 1
          fi

      - name: Upload enriched SBOM
        uses: actions/upload-artifact@v4
        with:
          name: enriched-sbom
          path: enriched-sbom.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload filtered SBOM
        uses: actions/upload-artifact@v4
        with:
          name: filtered-sbom
          path: filtered-sbom.json
          if-no-files-found: error
          retention-days: 7

  # ────────────────────────────────────────────────────────────────────────────
  # Job 2.2: Download sources & Run FOSSology scan
  # ────────────────────────────────────────────────────────────────────────────
  scan-fossology:
    name: " Download & FOSSology scan"
    runs-on: [self-hosted, linux]
    needs: filter-by-clearing-state
    timeout-minutes: 120

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Download filtered SBOM
        uses: actions/download-artifact@v4
        with:
          name: filtered-sbom

      - name: Determine whether scanning is required
        id: scan-needed
        run: |
          filtered_count=$(jq '.components | length' filtered-sbom.json)
          if [ "$filtered_count" -gt 0 ]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            echo "Scanning is required for $filtered_count components"
          else
            echo "required=false" >> "$GITHUB_OUTPUT"
            echo "No components require scanning"
          fi

      - name: Initialize source manifest
        run: echo '[]' > source-manifest.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Linux SCA prerequisites
        if: steps.scan-needed.outputs.required == 'true'
        run: |
          set -euo pipefail
          for command_name in jq curl python3 docker; do
            command -v "$command_name" >/dev/null || {
              echo "ERROR: Required Linux command is unavailable: $command_name"
              exit 1
            }
          done
          docker info >/dev/null
          if ! docker image inspect fossology/fossology:scanner >/dev/null 2>&1; then
            echo "FOSSology scanner image is not cached; pulling it now"
            docker pull fossology/fossology:scanner
          fi
          echo "Linux SCA prerequisites are available"

      - name: Download source archives for FOSSology
        if: steps.scan-needed.outputs.required == 'true'
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          import urllib.parse
          from pathlib import Path

          source_root = Path("source_archives")
          source_root.mkdir(parents=True, exist_ok=True)

          def validate_archive(path):
              if not path.is_file() or path.stat().st_size == 0:
                  raise RuntimeError("downloaded archive is empty")
              prefix = path.read_bytes()[:512].lstrip().lower()
              if prefix.startswith((b"<html", b"<!doctype html", b"<?xml")):
                  raise RuntimeError("downloaded content is HTML/XML, not a source archive")
              if not (
                  __import__("zipfile").is_zipfile(path)
                  or __import__("tarfile").is_tarfile(path)
              ):
                  raise RuntimeError("downloaded content is not a supported ZIP/JAR or tar archive")

          with Path("filtered-sbom.json").open(encoding="utf-8") as stream:
              sbom = json.load(stream)

          failures = []
          for component in sbom.get("components", []):
              source_url = next(
                  (
                      reference.get("url")
                      for reference in component.get("externalReferences") or []
                      if reference.get("url")
                      and (
                          reference.get("type") == "source-distribution"
                          or reference.get("comment") == "source archive (download location)"
                      )
                  ),
                  None,
              )
              name = component.get("name") or "unknown"
              version = component.get("version") or "unknown"
              purl = component.get("purl") or ""
              package_type = purl.removeprefix("pkg:").split("/", 1)[0] or "unclassified"
              if not source_url or source_url.startswith("file:"):
                  failures.append(f"{purl or name + '@' + version}: missing remote source archive URL")
                  continue

              filename = Path(urllib.parse.unquote(urllib.parse.urlparse(source_url).path)).name
              if not filename or filename in {".", ".."}:
                  failures.append(f"{purl or name + '@' + version}: source URL has no archive filename")
                  continue

              destination = source_root / package_type / name / version
              destination.mkdir(parents=True, exist_ok=True)
              archive = destination / filename
              if archive.is_file() and archive.stat().st_size > 0:
                  try:
                    validate_archive(archive)
                  except RuntimeError as error:
                    print(f"  [REPLACE] {name}@{version}: {error}")
                    archive.unlink()
                  else:
                    print(f"  [SKIP] {name}@{version} source archive already retained")
                    continue

              print(f"  [GET]  {name}@{version} <- {source_url}")
              temporary = archive.with_suffix(archive.suffix + ".part")
              try:
                  subprocess.run(
                      [
                          "curl", "--fail", "--location", "--retry", "3",
                          "--retry-delay", "2", "--connect-timeout", "20",
                          "--max-time", "300", source_url, "-o", str(temporary),
                      ],
                      check=True,
                  )
                  validate_archive(temporary)
                  temporary.replace(archive)
              except (OSError, subprocess.CalledProcessError, RuntimeError) as error:
                  temporary.unlink(missing_ok=True)
                  failures.append(f"{purl or name + '@' + version}: {error}")

          if failures:
              print("Unable to retain source archives:")
              print("\n".join(f"  - {failure}" for failure in failures))
              raise SystemExit("Source archive coverage is incomplete")
          PY

      - name: Protect SBOM from FOSSology Docker mount
        if: steps.scan-needed.outputs.required == 'true'
        run: |
          cp filtered-sbom.json filtered-sbom-pristine.json
          sha256sum filtered-sbom.json > filtered-sbom.sha256

      - name: Run FOSSology analysis 
        if: steps.scan-needed.outputs.required == 'true'
        uses: shatakshisgtiwari-jpg/fossology-action@feat/action/per-dependency-report
        with:
          scan_mode: "scan-only-deps"
          scanners: "ojo copyright nomos"
          report_format: "SPDX_JSON"
          sbom_path: "filtered-sbom.json"
          per_dependency_report: "true"
          report_dir: "per-dependency-reports"

      - name: Restore SBOM if FOSSology modified it
        if: steps.scan-needed.outputs.required == 'true'
        run: |
          if ! sha256sum -c filtered-sbom.sha256 --quiet 2>/dev/null; then
            echo "::warning::FOSSology Docker container modified filtered-sbom.json — restoring pristine copy"
            cp filtered-sbom-pristine.json filtered-sbom.json
          fi

      - name: Verify FOSSology output
        if: steps.scan-needed.outputs.required == 'true'
        run: |
          if [ ! -f "results/sbom_spdx.json" ]; then
            echo "ERROR: results/sbom_spdx.json not found; FOSSology did not produce the consolidated report"
            exit 1
          fi
          if [ ! -s "results/sbom_spdx.json" ] || ! jq empty "results/sbom_spdx.json" >/dev/null 2>&1; then
            echo "ERROR: results/sbom_spdx.json is empty or invalid JSON"
            exit 1
          fi
          report_files=$(find "${{ env.REPORT_DIR }}" -name "*.spdx.json" -type f 2>/dev/null | wc -l)
          if [ "$report_files" -eq 0 ]; then
            echo "ERROR: No per-dependency SPDX reports were produced"
            exit 1
          fi
          invalid_reports=$(find "${{ env.REPORT_DIR }}" -name "*.spdx.json" -type f -size 0 | wc -l)
          if [ "$invalid_reports" -ne 0 ]; then
            echo "ERROR: $invalid_reports per-dependency SPDX report(s) are empty"
            exit 1
          fi
          echo "FOSSology output verified: consolidated_report=present per_dependency_reports=$report_files"

      - name: Stage downloaded sources for SW360 upload
        if: steps.scan-needed.outputs.required == 'true'
        env:
          SOURCE_DIR: ${{ env.SOURCE_DIR }}
        run: |
          python3 - <<'PY'
          import json
          import hashlib
          import os
          import shutil
          from pathlib import Path
          from urllib.parse import unquote, urlparse

          archive_root = Path("source_archives")
          source_dir = Path(os.environ["SOURCE_DIR"])
          source_dir.mkdir(parents=True, exist_ok=True)

          with Path("filtered-sbom.json").open(encoding="utf-8") as stream:
              sbom = json.load(stream)

          staged = 0
          missing = 0
          manifest = []
          for component in sbom.get("components", []):
              properties = component.get("properties", [])
              release_id = next(
                (item.get("value") for item in properties
                 if item.get("name") == "siemens:sw360Id" and item.get("value")),
                None,
              )
              source_url = next(
                (
                  reference.get("url")
                  for reference in component.get("externalReferences") or []
                  if reference.get("url")
                  and (
                    reference.get("type") == "source-distribution"
                    or reference.get("comment") == "source archive (download location)"
                  )
                ),
                None,
              )
              component_name = component.get("name")
              component_version = component.get("version")
              if not release_id:
                print(f"  [ERROR] Missing SW360 release ID for {component_name}@{component_version}")
                missing += 1
                continue
              if not source_url or source_url.startswith("file:"):
                print(f"  [ERROR] Missing remote source archive URL for {component_name}@{component_version}")
                missing += 1
                continue

              filename = Path(unquote(urlparse(source_url).path)).name
              if not filename:
                print(f"  [WARN] No source filename for {component.get('name')}")
                missing += 1
                continue

              purl = component.get("purl", "")
              package_type = purl.removeprefix("pkg:").split("/", 1)[0] if purl else ""
              archive = archive_root / package_type / component.get("name", "") / component.get("version", "") / filename
              if not archive.is_file() or archive.stat().st_size == 0:
                print(f"  [ERROR] Retained source archive is missing for {component_name}@{component_version}: {archive}")
                missing += 1
                continue

              preferred_hash = hashlib.sha256(archive.read_bytes()).hexdigest()
              target = source_dir / filename
              if target.is_file():
                target_hash = hashlib.sha256(target.read_bytes()).hexdigest()
                if target_hash != preferred_hash:
                  raise SystemExit(
                    f"Source filename collision for {filename}: "
                    f"{component.get('name')}@{component.get('version')} has different content"
                  )
              else:
                shutil.copy2(archive, target)
              print(f"  [OK] {component_name}@{component_version} -> {target}")
              staged += 1
              manifest.append({
                "bom_ref": component.get("bom-ref"),
                "name": component.get("name"),
                "version": component.get("version"),
                "release_id": release_id,
                "source_filename": target.name,
              })

          print(f"Staged source files: {staged}; components without local source files: {missing}")
          with Path("source-manifest.json").open("w", encoding="utf-8") as stream:
              json.dump(manifest, stream, indent=2)
              stream.write("\n")
          if missing:
              raise SystemExit("Source coverage is incomplete; refusing to continue")
          PY

      - name: Upload scan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-artifacts
          path: |
            results/
            ${{ env.REPORT_DIR }}/
            ${{ env.SOURCE_DIR }}/
            source-manifest.json
          if-no-files-found: warn
          retention-days: 7

      - name: Remove scanner workspace
        if: always()
        run: |
          set -euo pipefail
          for path in pkg_downloads results "${{ env.REPORT_DIR }}"; do
            if [ -e "$GITHUB_WORKSPACE/$path" ]; then
              docker run --rm --user 0:0 \
                --entrypoint /bin/sh \
                -v "$GITHUB_WORKSPACE:/workspace" \
                fossology/fossology:scanner \
                -c 'rm -rf -- "/workspace/$1"' sh "$path"
            fi
          done

  # ╔══════════════════════════════════════════════════════════════════════════╗
  # ║  STAGE 3 — Create releases, upload to SW360 & validation                ║
  # ║  After FOSSology, ensures releases exist, attaches source files, uploads ║
  # ║  scan reports, and validates that all prerequisites are met.              ║
  # ╚══════════════════════════════════════════════════════════════════════════╝

  # ────────────────────────────────────────────────────────────────────────────
  # Job 3.1: Upload sources & scan reports to SW360
  # ────────────────────────────────────────────────────────────────────────────
  upload-to-sw360:
    name: " Upload to SW360"
    runs-on: [self-hosted, linux]
    needs: scan-fossology
    timeout-minutes: 120

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Download scan artifacts
        uses: actions/download-artifact@v4
        with:
          name: scan-artifacts
          path: scan-output

      - name: Download enriched SBOM (all project components)
        uses: actions/download-artifact@v4
        with:
          name: enriched-sbom
          path: enriched-input

      - name: Download filtered SBOM (components needing scan)
        uses: actions/download-artifact@v4
        with:
          name: filtered-sbom
          path: filtered-input

      - name: Download SW360 project ID
        uses: actions/download-artifact@v4
        with:
          name: project-id
          path: project-input

      - name: Checkout CapyCLI fork
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/capycli
          ref: feat/sw360/upload_reports
          path: ${{ env.CAPYCLI_DIR }}
          clean: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Get capycli commit SHA
        id: capycli-sha
        run: |
          cd ${{ env.CAPYCLI_DIR }}
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache capycli installation
        id: cache-capycli
        uses: actions/cache@v4
        with:
          path: ${{ env.CAPYCLI_DIR }}/.installed
          key: capycli-${{ runner.os }}-py3.11-${{ steps.capycli-sha.outputs.sha }}

      - name: Install CapyCLI
        if: steps.cache-capycli.outputs.cache-hit != 'true'
        run: |
          pip install . --force-reinstall
          mkdir -p ${{ env.CAPYCLI_DIR }}/.installed
          touch ${{ env.CAPYCLI_DIR }}/.installed/marker
        working-directory: ${{ env.CAPYCLI_DIR }}

      - name: Restore files to working directory
        run: |
          cp "enriched-input/enriched-sbom.json" "enriched-sbom.json"
          cp "filtered-input/filtered-sbom.json" "filtered-sbom.json"
          cp "project-input/project-id.txt" "project-id.txt"
          echo "Restored enriched-sbom.json, filtered-sbom.json, and project-id.txt"
          [ -d "scan-output/results" ] && cp -r "scan-output/results" . && echo "Restored results" || true
          [ -d "scan-output/${{ env.REPORT_DIR }}" ] && cp -r "scan-output/${{ env.REPORT_DIR }}" . && echo "Restored ${{ env.REPORT_DIR }}" || true
          [ -d "scan-output/sources" ] && cp -r "scan-output/sources" . && echo "Restored sources" || true
          cp "scan-output/source-manifest.json" "source-manifest.json"
          echo "Restored source-manifest.json"

      - name: Create releases and attach source files after FOSSology
        run: |
          # This is intentionally after the FOSSology job and before report
          # upload. Only the filtered SBOM is processed here, so existing
          # cleared releases are not modified or reprocessed.
          python -m capycli bom createreleases \
            -i filtered-sbom.json \
            -o processed-sbom.json \
            -url ${{ vars.SW360_URL }} \
            -t ${{ secrets.SW360_TOKEN }} \
            -source ${{ env.SOURCE_DIR }} \
            -X \
            -v

      - name: Verify source attachments on SW360
        run: |
          set -o pipefail
          filtered_count=$(jq '.components | length' filtered-sbom.json)
          manifest_count=$(jq 'length' source-manifest.json)
          if [ "$manifest_count" -ne "$filtered_count" ]; then
            echo "ERROR: Source manifest covers $manifest_count of $filtered_count filtered components"
            exit 1
          fi

          sw360_url="${{ vars.SW360_URL }}"
          sw360_url="${sw360_url%/}"
          token="${{ secrets.SW360_TOKEN }}"

          verify_source_attachments() {
            local verified=0
            while IFS= read -r release; do
              release_id=$(echo "$release" | jq -r '.release_id')
              name=$(echo "$release" | jq -r '.name')
              version=$(echo "$release" | jq -r '.version')
              source_filename=$(echo "$release" | jq -r '.source_filename')
              local_source="${{ env.SOURCE_DIR }}/$source_filename"
              if [ ! -f "$local_source" ]; then
                echo "ERROR: Staged source file is missing: $local_source"
                return 1
              fi
              expected_sha1=$(sha1sum "$local_source" | awk '{print $1}')
              matching_source=$(curl --silent --show-error --fail-with-body \
                --retry 3 --retry-delay 2 \
                --header "Authorization: Token $token" \
                "$sw360_url/resource/api/releases/$release_id/attachments" \
                | jq -r --arg filename "$source_filename" --arg sha1 "$expected_sha1" '
                  [._embedded["sw360:attachments"][]?
                   | select((.attachmentType // "") | startswith("SOURCE"))
                   | select(.filename == $filename)
                   | select(((.sha1 // "") | ascii_downcase) == ($sha1 | ascii_downcase))
                  ] | length') || return 1
              if [ "$matching_source" -ne 1 ]; then
                echo "SOURCE attachment does not match $source_filename/$expected_sha1 for $name@$version ($release_id)"
                return 1
              fi
              verified=$((verified + 1))
            done < <(jq -c '.[]' source-manifest.json)
            echo "Verified SOURCE attachments on $verified SW360 releases"
          }

          for attempt in 1 2 3; do
            if verify_source_attachments; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "ERROR: Source attachment verification failed after $attempt attempts"
              exit 1
            fi
            echo "Retrying source attachment creation ($attempt/3)"
            python -m capycli bom createreleases \
              -i filtered-sbom.json \
              -o processed-sbom.json \
              -url ${{ vars.SW360_URL }} \
              -t ${{ secrets.SW360_TOKEN }} \
              -source ${{ env.SOURCE_DIR }} \
              -X \
              -v || true
          done

      - name: Assemble complete final SBOM
        run: |
          python3 - <<'PY'
          import json

          def component_key(component):
              return component.get("bom-ref") or f"{component.get('name', '')}@{component.get('version', '')}"

          def merge_properties(base, updated):
              merged = {item.get("name"): item for item in base if item.get("name")}
              for item in updated:
                  if item.get("name"):
                      merged[item["name"]] = item
              return list(merged.values())

          with open("enriched-sbom.json", encoding="utf-8") as stream:
              complete = json.load(stream)
          with open("processed-sbom.json", encoding="utf-8") as stream:
              processed = json.load(stream)

          processed_by_key = {
              component_key(component): component
              for component in processed.get("components", [])
          }

          final_components = []
          for component in complete.get("components", []):
              updated = processed_by_key.get(component_key(component))
              if updated:
                  merged = dict(component)
                  merged.update(updated)
                  merged["properties"] = merge_properties(
                      component.get("properties", []),
                      updated.get("properties", []),
                  )
                  final_components.append(merged)
              else:
                  final_components.append(component)

          complete["components"] = final_components
          with open("final-sbom.json", "w", encoding="utf-8") as stream:
              json.dump(complete, stream, indent=2)
              stream.write("\n")
          PY

          project_id=$(tr -d '[:space:]' < project-id.txt)
          if [ -z "$project_id" ]; then
            echo "ERROR: project-id.txt is empty"
            exit 1
          fi
          sw360_url="${{ vars.SW360_URL }}"
          sw360_url="${sw360_url%/}"
          project_url="$sw360_url/group/guest/projects/-/project/detail/$project_id"

          jq --arg project_id "$project_id" \
             --arg project_name "${{ env.PROJECT_NAME }}" \
             --arg project_version "${{ env.PROJECT_VERSION }}" \
             --arg project_url "$project_url" \
             --arg sw360_url "$sw360_url" '
            .metadata = (.metadata // {}) |
            .metadata.properties = ((.metadata.properties // [])
              | map(select(
                  .name != "siemens:sw360ProjectId" and
                  .name != "siemens:sw360ProjectName" and
                  .name != "siemens:sw360ProjectVersion" and
                  .name != "siemens:sw360ProjectUrl"
                ))
              + [
                  {"name": "siemens:sw360ProjectId", "value": $project_id},
                  {"name": "siemens:sw360ProjectName", "value": $project_name},
                  {"name": "siemens:sw360ProjectVersion", "value": $project_version},
                  {"name": "siemens:sw360ProjectUrl", "value": $project_url}
                ]) |
            .components |= map(
              . as $component |
              (($component.properties // [])
                | map(select(.name == "siemens:sw360Id") | .value)
                | first) as $release_id |
              .properties = ((.properties // [])
                | map(select(.name != "siemens:sw360ReleaseUrl"))
                + (if ($release_id // "") != "" then
                     [{"name": "siemens:sw360ReleaseUrl", "value": ($sw360_url + "/resource/api/releases/" + $release_id)}]
                   else [] end))
            )
          ' final-sbom.json > final-sbom.json.tmp && mv final-sbom.json.tmp final-sbom.json

      - name: Verify final SBOM
        run: |
          if [ ! -f final-sbom.json ]; then
            echo "ERROR: final-sbom.json not found"
            exit 1
          fi
          size=$(stat -c%s final-sbom.json)
          complete_count=$(jq '.components | length' enriched-sbom.json)
          final_count=$(jq '.components | length' final-sbom.json)
          with_ids=$(jq '[.components[] | select(.properties[]?.name == "siemens:sw360Id")] | length' final-sbom.json)
          with_release_urls=$(jq '[.components[] | select(.properties[]?.name == "siemens:sw360ReleaseUrl")] | length' final-sbom.json)
          project_id_count=$(jq '[.metadata.properties[]? | select(.name == "siemens:sw360ProjectId" and (.value // "") != "")] | length' final-sbom.json)
          project_name_count=$(jq '[.metadata.properties[]? | select(.name == "siemens:sw360ProjectName" and (.value // "") != "")] | length' final-sbom.json)
          project_version_count=$(jq '[.metadata.properties[]? | select(.name == "siemens:sw360ProjectVersion" and (.value // "") != "")] | length' final-sbom.json)
          project_url_count=$(jq '[.metadata.properties[]? | select(.name == "siemens:sw360ProjectUrl" and (.value // "") != "")] | length' final-sbom.json)
          echo "final-sbom.json: $size bytes, $final_count/$complete_count components, $with_ids with sw360Id, $with_release_urls with release URL"
          if [ "$final_count" -eq 0 ] || [ "$final_count" -ne "$complete_count" ]; then
            echo "ERROR: Final SBOM component count does not match the complete enriched SBOM"
            exit 1
          fi
          if [ "$with_ids" -ne "$final_count" ] || [ "$with_release_urls" -ne "$final_count" ]; then
            echo "ERROR: Every final SBOM component must have a SW360 release ID and release URL"
            exit 1
          fi
          if [ "$project_id_count" -ne 1 ] || [ "$project_name_count" -ne 1 ] || \
             [ "$project_version_count" -ne 1 ] || [ "$project_url_count" -ne 1 ]; then
            echo "ERROR: Final SBOM is missing complete SW360 project metadata"
            exit 1
          fi

      - name: Upload per-dependency scan reports to SW360
        run: |
          report_count=$(find "${{ env.REPORT_DIR }}" -name "*.spdx.json" -type f 2>/dev/null | wc -l)
          filtered_count=$(jq '.components | length' filtered-sbom.json)
          echo "Per-dependency reports found: $report_count"

          if [ "$report_count" -gt 0 ]; then
            max_retries=3
            retry_delay=30
            last_exit=0

            for attempt in $(seq 1 $max_retries); do
              echo "=== Upload attempt $attempt of $max_retries ==="
              set +e
              python -m capycli bom uploadreports \
                -i final-sbom.json \
                --report-dir ${{ env.REPORT_DIR }} \
                --filetype COMPONENT_LICENSE_INFO_XML \
                --comment "Fossology SPDX scan - ${{ env.PROJECT_NAME }} ${{ env.PROJECT_VERSION }}" \
                -url ${{ vars.SW360_URL }} \
                -t ${{ secrets.SW360_TOKEN }} \
                -o final-sbom.json \
                -X \
                -v
              last_exit=$?
              set -e

              if [ "$last_exit" -eq 0 ]; then
                echo "Upload completed successfully on attempt $attempt"
                break
              else
                echo "Upload failed (exit code $last_exit) on attempt $attempt"
                if [ "$attempt" -lt "$max_retries" ]; then
                  echo "Retrying in $retry_delay seconds..."
                  sleep "$retry_delay"
                fi
              fi
            done

            if [ "$last_exit" -ne 0 ]; then
              echo "ERROR: Per-dependency upload failed after $max_retries attempts"
              exit "$last_exit"
            fi
          elif [ "$filtered_count" -gt 0 ]; then
            echo "ERROR: $filtered_count components require scan reports, but no per-dependency reports were produced"
            exit 1
          else
            echo "No scan reports required because filtered-sbom.json is empty"
          fi

      - name: Mark uploaded releases REPORT_AVAILABLE
        run: |
          filtered_count=$(jq '.components | length' filtered-sbom.json)
          if [ "$filtered_count" -eq 0 ]; then
            echo "No filtered releases require a clearing-state update"
            exit 0
          fi

          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          report_dir = Path(os.environ["REPORT_DIR"])
          report_names = {
              path.name
              for path in report_dir.iterdir()
              if path.is_file()
          }

          def find_report(component_name, component_version):
              exact_prefix = f"{component_name}@{component_version}"
              for filename in report_names:
                  if filename.startswith(exact_prefix):
                      return filename

              name_prefix = f"{component_name}@"
              for filename in report_names:
                  if filename.startswith(name_prefix):
                      return filename

              safe_name = re.sub(r"[^a-zA-Z0-9._-]", "_", component_name)
              safe_version = re.sub(r"[^a-zA-Z0-9._-]", "_", component_version or "")
              safe_exact_prefix = f"{safe_name}@{safe_version}"
              for filename in report_names:
                  if filename.startswith(safe_exact_prefix):
                      return filename

              safe_name_prefix = f"{safe_name}@"
              for filename in report_names:
                  if filename.startswith(safe_name_prefix):
                      return filename

              return None

          with open("filtered-sbom.json", encoding="utf-8") as stream:
              sbom = json.load(stream)

          updates = []
          missing = []
          for component in sbom.get("components", []):
              properties = component.get("properties", [])
              release_id = next(
                  (item.get("value") for item in properties
                   if item.get("name") == "siemens:sw360Id" and item.get("value")),
                  None,
              )
              name = component.get("name", "")
              version = component.get("version", "")
              report = find_report(name, version)

              if not release_id or not report:
                  missing.append({
                      "name": name,
                      "version": version,
                      "release_id": release_id,
                      "report": report,
                  })
                  continue

              updates.append({
                  "name": name,
                  "version": version,
                  "release_id": release_id,
                  "report": report,
              })

          with open("reportable-releases.json", "w", encoding="utf-8") as stream:
              json.dump(updates, stream, indent=2)

          if missing:
              print("ERROR: Cannot mark all filtered releases REPORT_AVAILABLE:")
              for item in missing:
                  print(f"  {item['name']}@{item['version']}: "
                        f"release_id={item['release_id'] or '(missing)'}, "
                        f"report={item['report'] or '(missing)'}")
              raise SystemExit(1)

          print(f"Prepared {len(updates)} releases for REPORT_AVAILABLE")
          PY

          sw360_url="${{ vars.SW360_URL }}"
          sw360_url="${sw360_url%/}"
          token="${{ secrets.SW360_TOKEN }}"
          update_count=$(jq 'length' reportable-releases.json)
          updated=0

          while IFS= read -r release; do
            release_id=$(echo "$release" | jq -r '.release_id')
            name=$(echo "$release" | jq -r '.name')
            version=$(echo "$release" | jq -r '.version')
            release_url="$sw360_url/resource/api/releases/$release_id"
            echo "Setting clearingState=REPORT_AVAILABLE for $name@$version ($release_id)"

            curl --silent --show-error --fail-with-body \
              --retry 3 --retry-delay 2 \
              --request PATCH \
              --header "Authorization: Token $token" \
              --header "Content-Type: application/json" \
              --data '{"clearingState":"REPORT_AVAILABLE"}' \
              "$release_url" >/dev/null

            verified_state=$(curl --silent --show-error --fail-with-body \
              --retry 3 --retry-delay 2 \
              --header "Authorization: Token $token" \
              "$release_url" | jq -r '.clearingState // empty')
            if [ "$verified_state" != "REPORT_AVAILABLE" ]; then
              echo "ERROR: SW360 returned clearingState='$verified_state' for $name@$version"
              exit 1
            fi
            updated=$((updated + 1))
          done < <(jq -c '.[]' reportable-releases.json)

          if [ "$updated" -ne "$update_count" ]; then
            echo "ERROR: Updated $updated of $update_count releases"
            exit 1
          fi
          echo "Verified REPORT_AVAILABLE on $updated SW360 releases"

          jq --slurpfile updated_releases reportable-releases.json '
            .components |= map(
              . as $component |
              ([.properties[]? | select(.name == "siemens:sw360Id") | .value] | first) as $release_id |
              if ($updated_releases[0] | any(.[]; .release_id == $release_id)) then
                .properties = ((.properties // [])
                  | map(select(.name != "siemens:clearingState"))
                  + [{"name": "siemens:clearingState", "value": "REPORT_AVAILABLE"}])
              else . end
            )
          ' final-sbom.json > final-sbom.json.tmp && mv final-sbom.json.tmp final-sbom.json

      - name: Verify final SBOM after report upload
        run: |
          complete_count=$(jq '.components | length' enriched-sbom.json)
          final_count=$(jq '.components | length' final-sbom.json)
          with_ids=$(jq '[.components[] | select(.properties[]?.name == "siemens:sw360Id")] | length' final-sbom.json)
          with_release_urls=$(jq '[.components[] | select(.properties[]?.name == "siemens:sw360ReleaseUrl")] | length' final-sbom.json)
          if [ "$final_count" -ne "$complete_count" ] || \
             [ "$with_ids" -ne "$final_count" ] || \
             [ "$with_release_urls" -ne "$final_count" ]; then
            echo "ERROR: Report upload changed final SBOM component or SW360 release coverage"
            exit 1
          fi
          echo "Final SBOM remains complete after report upload: $final_count components"

      - name: Upload final SBOM
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: final-sbom
          path: final-sbom.json
          if-no-files-found: error
          retention-days: 7

  # ────────────────────────────────────────────────────────────────────────────
  # Job 3.2: Validate pipeline completeness
  # ────────────────────────────────────────────────────────────────────────────
  validate-pipeline:
    name: " Validate pipeline"
    runs-on: [self-hosted, linux]
    needs: upload-to-sw360
    timeout-minutes: 30

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Download final SBOM
        uses: actions/download-artifact@v4
        with:
          name: final-sbom

      - name: Download project ID
        uses: actions/download-artifact@v4
        with:
          name: project-id

      - name: Checkout CapyCLI fork
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/capycli
          ref: feat/sw360/upload_reports
          path: ${{ env.CAPYCLI_DIR }}
          clean: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Get capycli commit SHA
        id: capycli-sha
        run: |
          cd ${{ env.CAPYCLI_DIR }}
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache capycli installation
        id: cache-capycli
        uses: actions/cache@v4
        with:
          path: ${{ env.CAPYCLI_DIR }}/.installed
          key: capycli-${{ runner.os }}-py3.11-${{ steps.capycli-sha.outputs.sha }}

      - name: Install CapyCLI
        if: steps.cache-capycli.outputs.cache-hit != 'true'
        run: |
          pip install . --force-reinstall
          mkdir -p ${{ env.CAPYCLI_DIR }}/.installed
          touch ${{ env.CAPYCLI_DIR }}/.installed/marker
        working-directory: ${{ env.CAPYCLI_DIR }}

      - name: Validate pipeline completeness
        run: |
          project_id=$(cat project-id.txt | tr -d '[:space:]')
          if [ -z "$project_id" ]; then
            echo "ERROR: Project ID not available"
            exit 1
          fi

          python -m capycli project prerequisites \
            -i final-sbom.json \
            -id "$project_id" \
            -url ${{ vars.SW360_URL }} \
            -t ${{ secrets.SW360_TOKEN }} \
            --check-reports \
            --forceerror \
            -v

      # Note: all-sbom-artifacts and fossology-reports are intentionally omitted.
      # final-sbom.json is already uploaded by upload-to-sw360 job.
      # results/ and per-dependency-reports/ are already in scan-artifacts.
      # Uploading them again here would create redundant artifacts.
